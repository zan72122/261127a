// ---------------------------------------------------------------- procedural textures

    const yu = H[((y - 1 + h) % h) * w + x], yd = H[((y + 1) % h) * w + x];

// silk weave: fine warp/weft crossings with slub variation (normal map only)
const silkNormal = canvasTex(256, 256, (g, w, h) => {
  const H = new Float32Array(w * h);
  const rowV = [], colV = [];
  for (let i = 0; i < 64; i++) { rowV.push(0.75 + rnd() * 0.5); colV.push(0.75 + rnd() * 0.5); }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const cx = Math.floor(x / 4), cy = Math.floor(y / 4);
    const fx = (x % 4) / 4, fy = (y % 4) / 4;
    const over = (cx + cy) % 2 === 0;
    const warp = Math.sin(Math.PI * fx) * colV[cx % 64];
    const weft = Math.sin(Math.PI * fy) * rowV[cy % 64];
    H[y * w + x] = (over ? warp * 0.9 + weft * 0.4 : weft * 0.9 + warp * 0.4) + Math.sin(y * 0.09 + Math.sin(x * 0.02) * 3) * 0.08;

// limestone flagstones (color + normal)
const STONE_W = 1024;
const stoneData = (() => {
  const w = STONE_W, h = STONE_W;
  const col = new Uint8ClampedArray(w * h * 4), H = new Float32Array(w * h);
  const rows = 12, rh = h / rows;
  const ids = [];
  for (let i = 0; i < 400; i++) ids.push(rnd());

  const NS = 64, nt = new Float32Array(NS * NS); for (let i = 0; i < NS * NS; i++) nt[i] = rnd();

    const a = nt[((yi & 63) * NS) + (xi & 63)], b = nt[((yi & 63) * NS) + ((xi + 1) & 63)], c = nt[(((yi + 1) & 63) * NS) + (xi & 63)], d = nt[(((yi + 1) & 63) * NS) + ((xi + 1) & 63)];
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy); return lerp(lerp(a, b, ux), lerp(c, d, ux), uy); };
  for (let y = 0; y < h; y++) {
    const r = Math.floor(y / rh), fy = (y - r * rh) / rh;
    const off = (r % 2) * 0.5 + ids[r] * 0.2;
    const cw = w / (8 + (r % 3));
    for (let x = 0; x < w; x++) {
      const u = x / cw + off, c = Math.floor(u), fx = u - c;
      const id = ids[(r * 17 + ((c % 23) + 23) % 23) % 400];
      const ex = Math.min(fx, 1 - fx) * cw, ey = Math.min(fy, 1 - fy) * rh;
      const e = Math.min(ex, ey);
      const groove = e < 2.2 ? 0 : e < 5 ? (e - 2.2) / 2.8 : 1;
      const n1 = vn(x / 28, y / 28), n2 = vn(x / 6 + 17, y / 6 + 9), n3 = vn(x / 90 + 3, y / 90);
      const v = 0.94 + (id - 0.5) * 0.07 + (n1 - 0.5) * 0.05 + (n2 - 0.5) * 0.03 + (n3 - 0.5) * 0.04;

const stoneMap = canvasTex(STONE_W, STONE_W, (g, w, h) => { const img = g.createImageData(w, h); img.data.set(stoneData.col); g.putImageData(img, 0, 0); }, true);
const stoneNormal = canvasTex(STONE_W, STONE_W, (g, w, h) => heightToNormal(g, w, h, stoneData.H, 2.2));

// fine stone grain for columns and walls

  heightToNormal(g, w, h, H, 3.0);

const fluteNormal = canvasTex(512, 8, (g, w, h) => {
  const H = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const f = (x / w * 20) % 1; H[y * w + x] = Math.sqrt(Math.max(0, 1 - Math.pow((f - 0.5) * 2.1, 2))) * -1; }

  uSunW: { value: new V3(0.4, 0.85, 0.3).normalize() },
  uCExt: { value: new Array(N).fill(0) },
  uCCol: { value: Array.from({ length: N }, () => new V3(1, 1, 1)) },
  uCGain: { value: 1.0 },
  uFakeBeam: { value: 0 },
  uHubTint: { value: new V3(1, 0.92, 0.75) },
  uLeafWind: { value: 1.0 },

const CANOPY_GLSL = `
uniform float uCExt[24];
uniform vec3 uCCol[24];
uniform vec3 uSunW;
uniform float uCGain;
uniform float uFakeBeam;
uniform vec3 uHubTint;
varying vec3 vWPos;
float cDomeY(float r){ return 17.5 + 4.5*(1.0 - r*r/81.0); }
vec3 canopyTint(vec3 P){
  vec3 L = uSunW;
  float h = 19.5; vec3 Q = P;
  for(int k=0;k<3;k++){ float t=(h-P.y)/max(L.y,0.05); Q=P+L*t; float r=length(Q.xz); h=cDomeY(min(r,9.0)); }

    sh.uniforms.uCExt = U.uCExt; sh.uniforms.uCCol = U.uCCol; sh.uniforms.uSunW = U.uSunW; sh.uniforms.uCGain = U.uCGain;
    sh.uniforms.uFakeBeam = U.uFakeBeam; sh.uniforms.uHubTint = U.uHubTint; sh.uniforms.uTime = U.uTime; sh.uniforms.uLeafWind = U.uLeafWind;

scene.add(amb);

// ---------------------------------------------------------------- sky
const skyU = {

  uSunW: U.uSunW, uSunC: { value: new THREE.Color('#FFF4E5') }, uTime: U.uTime, uOct: { value: 3 }, uGold: { value: 0.2 },

               mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }

function gridGeo(nx, ny) {
  const g = new THREE.BufferGeometry();
  const cnt = (nx + 1) * (ny + 1);
  const pos = new Float32Array(cnt * 3), grid = new Float32Array(cnt * 2), nrm = new Float32Array(cnt * 3);

  for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) {
    const u = i / nx, v = j / ny;
    grid[k * 2] = u; grid[k * 2 + 1] = v;
    pos[k * 3] = u; pos[k * 3 + 1] = 0; pos[k * 3 + 2] = v; nrm[k * 3 + 1] = 1; k++;

  const idx = [];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const a = j * (nx + 1) + i, b = a + 1, c = a + nx + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  g.setIndex(idx);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  g.setAttribute('aGrid', new THREE.BufferAttribute(grid, 2));
  g.setAttribute('uv', new THREE.BufferAttribute(grid.slice(), 2));
  return g;
}

    resetGrp.scale.setScalar(Math.max(0.001, k * 1.7));

const resetBase = new V3(3, 12.6, 0);

// ---------------------------------------------------------------- quality auto adjust
let fpsAcc = 0, fpsN = 0, fpsNow = 60, lowT = 0, highT = 0, coolT = 4;

  if (lowT > 2 && qi > 0) { applyQuality(QORDER[qi - 1]); coolT = 10; lowT = 0; goView(camMode, camFocus, 0.01); }
  else if (highT > 8 && qi < 2) { applyQuality(QORDER[qi + 1]); coolT = 20; highT = 0; goView(camMode, camFocus, 0.01); }
}

// ---------------------------------------------------------------- autotest driver (dispatches the same pointer events)

// ---------------------------------------------------------------- loop
let last = performance.now(), paused = false, ctxLost = false, frames = 0;

    updateCamera(dt);
    updatePanels(dt);
    updateMotes(dt);

    if (composer) composer.render(dt); else renderer.render(scene, camera);

}

// ---------------------------------------------------------------- lifecycle
function onResize() {

addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 250));
document.addEventListener('visibilitychange', () => {

// ---------------------------------------------------------------- start
applyQuality(qName);
const PRE = AUTOTEST ? 0 : clamp(parseInt(QS.get('pre') || '0', 10) || 0, 0, 24);
if (PRE > 0) {
  for (let k = 0; k < PRE; k++) { const p = panels[ORDER[k]]; p.state = 'fixed'; p.ext = 1; p.free = 0; p.latch = 1; p.mesh.visible = true; claspOpen[p.i] = 0; updateClasp(p.i); }
