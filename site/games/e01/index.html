const ARMCOL = ['#62b6ff', '#45e2d6', '#7fe89c', '#ffd36e', '#ffa8d0', '#b9a4ff'].map(h => new THREE.Color(h));

// ---------------------------------------------------------------- noise
function hash3(x, y, z) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);

}
function vnoise(x, y, z) {

  xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf); zf = zf * zf * (3 - 2 * zf);
  const l = (a, b, t) => a + (b - a) * t;
  const c000 = hash3(xi, yi, zi), c100 = hash3(xi + 1, yi, zi), c010 = hash3(xi, yi + 1, zi), c110 = hash3(xi + 1, yi + 1, zi);
  const c001 = hash3(xi, yi, zi + 1), c101 = hash3(xi + 1, yi, zi + 1), c011 = hash3(xi, yi + 1, zi + 1), c111 = hash3(xi + 1, yi + 1, zi + 1);
  return l(l(l(c000, c100, xf), l(c010, c110, xf), yf), l(l(c001, c101, xf), l(c011, c111, xf), yf), zf);
}

}
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

// ---------------------------------------------------------------- procedural textures
function makeGlowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.18, 'rgba(255,255,255,0.55)');
  gr.addColorStop(0.45, 'rgba(255,255,255,0.14)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');

}
function makeNormalTex() {
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;

    const u = x / N, v = y / N;
    const a = fbm(Math.cos(u * 6.2832) * 2 + 9, Math.sin(u * 6.2832) * 2 + 3, Math.cos(v * 6.2832) * 2 + Math.sin(v * 6.2832) * 2, 4);
    const b = vnoise(x * 0.21, y * 0.05, 4.2); // vertical growth streaks
    H[y * N + x] = a * 0.8 + b * 0.2;
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const hx = H[y * N + ((x + 1) % N)] - H[y * N + ((x - 1 + N) % N)];
    const hy = H[((y + 1) % N) * N + x] - H[((y - 1 + N) % N) * N + x];
    let nx = -hx * 6, ny = -hy * 6, nz = 1; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;

    let x = 40 + rnd() * 176, y = 40 + rnd() * 176, a = rnd() * 6.28;
    g.beginPath(); g.moveTo(x, y);
    const steps = 6 + (rnd() * 8) | 0;
    for (let i = 0; i < steps; i++) { a += (rnd() - 0.5) * 0.9; x += Math.cos(a) * 12; y += Math.sin(a) * 12; g.lineTo(x, y); }

  uFlashCol: { value: new THREE.Color(1, 1, 1) }, uRing: { value: new THREE.Vector3(0, 0, 1) },
  uRingCol: { value: new THREE.Color('#bff4ff') }, uCY: { value: CY },
  uPal: { value: ARMCOL.map(c => c.clone()) }

const GLOW_GLSL = `
uniform float uTime; uniform float uCaust; uniform float uSpread; uniform float uFlash; uniform float uCY;
uniform vec3 uFlashCol; uniform vec3 uRing; uniform vec3 uRingCol; uniform vec3 uPal[6];
vec3 palAt(float h){ h = mod(h, 6.0); int i = int(floor(h)); float f = smoothstep(0.0, 1.0, fract(h)); return mix(uPal[i], uPal[(i + 1) % 6], f); }
vec3 glowAdd(vec3 p){
  vec3 rel = p - vec3(0.0, uCY, 0.0);
  float d = length(rel);
  vec3 o = vec3(0.0);
  if (uCaust > 0.001) {
    float ang = atan(rel.z, rel.x);
    float h = ang / 6.2831853 * 6.0 + 3.0 + p.y * 0.06 + uTime * 0.07;
    vec2 q = p.xz * 0.32 + vec2(p.y * 0.21, -p.y * 0.17);
    float n1 = sin(q.x * 2.7 + uTime * 0.7 + 1.7 * sin(q.y * 1.9 - uTime * 0.4));

    float pat = 0.08 + 1.5 * pow(abs(n1 * n2), 1.6);

    o += palAt(h) * pat * reach * uCaust;

  float dxz = length(p.xz);

// ---------------------------------------------------------------- sky
const SKY_BASE = `
uniform vec3 uTop; uniform vec3 uHor; uniform vec3 uSunCol; uniform vec3 uSunDir; uniform vec3 uGround;
vec3 skyBase(vec3 d){
  float h = clamp(d.y, 0.0, 1.0);
  vec3 c = mix(uHor, uTop, pow(smoothstep(0.0, 0.2, h), 0.6));
  c = mix(c, uTop * 0.82, smoothstep(0.25, 0.9, h));
  c = mix(c, uGround, clamp(-d.y * 5.0, 0.0, 1.0));
  float s = max(dot(d, uSunDir), 0.0);
  c += uSunCol * (pow(s, 8.0) * 0.08 + pow(s, 60.0) * 0.35);

}`;

  float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y); }
  float fbm2(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vn(p); p *= 2.03; a *= 0.5; } return s; }

// ---------------------------------------------------------------- terrain: rock platform
function rockMaterial() {

{

{
  const count = 30;

// ---------------------------------------------------------------- glacier walls, far icebergs, floes

    else if (f >= 1 && AT.t > (AT.miss ? 0.9 : 1.6)) { synth('pointerup', tx, ty); AT.drag = false; if (AT.miss) AT.missDone = true; }
  }
  if (state === ST.FREE_PLAY) {
    AT.ftT += dt;
    if (window.__test.freeTaps < 4 && AT.ftT > 0.8) {
      AT.ftT = 0;
      const n = window.__test.freeTaps;
      const c = toScreen(CENTER);
      const tip = toScreen(_v.set(0, CY + 4, 0)); const Rp = Math.abs(c.y - tip.y);
      if (n === 3) { synth('pointerdown', c.x, c.y); }
      else { const a = ARM(n * 2) + G.discRot; synth('pointerdown', c.x + Math.cos(a) * Rp * 0.8, c.y - Math.sin(a) * Rp * 0.8); }
      synth('pointerup', 0, 0);
    }
  }
  if (window.__test.resets >= 1 && state === ST.WAIT_START && !window.__test.done) window.__test.done = true;
}

// ---------------------------------------------------------------- main loop
let last = performance.now();
const tmpC = new THREE.Color();
function frame(now) {
  requestAnimationFrame(frame);
  try {
    const rawDt = (now - last) / 1000; last = now;
    const dt = Math.min(AUTOTEST ? 0.2 : 0.1, Math.max(0, rawDt));
    if (rawDt > 0.5) { /* returning from background: skip fps sample */ } else fpsUpdate(rawDt);
    gameTime += dt; G.stT += dt;
    CU.uTime.value = gameTime;
    runTimers();
    autoUpdate(dt);
    dragUpdate(dt);
    guideUpdate(dt);
    if (state === ST.CLIMAX) { G.clT += dt; climaxUpdate(dt); }
    else if (state === ST.AFTERGLOW) { G.agT += dt; afterglowUpdate(dt); }
    else if (state === ST.FREE_PLAY) {
      G.fpIdle += dt;
      for (const b of beams) { b.target = 0.4 + 0.08 * Math.sin(gameTime * 1.2 + b.mat.uniforms.uPh.value); b.lenT = 4.0; }
      CU.uCaust.value += (0.3 - CU.uCaust.value) * (1 - Math.exp(-dt));
      if (G.fpIdle > (AUTOTEST ? 6 : 16)) startReset();
    } else if (state === ST.RESETTING) { G.resetT += dt; resetUpdate(dt); }
    // disc rotation
    if (G.discT < 1) { G.discT = Math.min(1, G.discT + dt / G.discDur); G.discRot = G.discFrom + (G.discTo - G.discFrom) * ease.inOut(G.discT); }
    disc.rotation.z = G.discRot;
    spin.rotation.y = G.spinA;
    crystal.position.y = CY + Math.sin(gameTime * 0.7) * 0.06;
    updatePieces(dt);
    updateRunners(dt);
    updateParticles(dt);
    // palette
    G.palT += (G.palTarget - G.palT) * (1 - Math.exp(-dt * 0.9));
    if (Math.abs(G.palTarget - G.palT) < 0.002) G.palT = G.palTarget;
    palApply(G.palT);
    skyUniforms.uTop.value.copy(CUR.top); skyUniforms.uHor.value.copy(CUR.hor); skyUniforms.uSunCol.value.copy(CUR.sun);
    scene.fog.color.copy(CUR.fog).lerp(CUR.ice, 0.3).lerp(CUR.top, 0.25);
    waterU.uFogCol.value.copy(scene.fog.color); waterU.uDeep.value.copy(CUR.water).multiplyScalar(0.8).lerp(CUR.deep, 0.5); waterU.uShallow.value.copy(CUR.water).lerp(CUR.ice, 0.4);
    waterU.uIce.value.copy(CUR.ice).lerp(CUR.deep, 0.25);
    sun.color.copy(CUR.sun); hemi.color.copy(CUR.hor).lerp(new THREE.Color(1, 1, 1), 0.4);
    const ps = Math.round(G.palT);
    if (ps !== G.envStage && Math.abs(G.palT - ps) < 0.02) { G.envStage = ps; buildEnv(); }
    // core
    G.coreLv += (G.coreLvT - G.coreLv) * (1 - Math.exp(-dt * 2));
    G.coreFlash *= Math.exp(-dt * 2.4);
    tmpC.copy(ICEGLOW).lerp(GOLD, G.coreGold);
    coreMat.emissive.copy(tmpC); innerMat.emissive.copy(tmpC);
    coreMat.emissiveIntensity = 0.1 + G.coreLv * 0.22 + G.coreFlash * 0.7 + G.coreGold * 0.55;
    innerMat.emissiveIntensity = 0.08 + G.coreLv * 0.35 + G.coreFlash * 0.9 + G.coreGold * 0.8;
    coreEdgeMat.opacity = 0.18 + G.coreLv * 0.25 + G.coreFlash * 0.4;
    coreSprite.material.color.copy(tmpC);
    coreSprite.material.opacity = Math.min(0.85, G.coreLv * 0.3 + G.coreFlash * 0.45 + G.coreGold * 0.4);
    const cs = 2.6 + G.coreLv * 1.2 + G.coreGold * 1.6; coreSprite.scale.set(cs, cs, 1);
    coreLight.color.copy(tmpC);
    coreLight.intensity = G.coreLv * 8 + G.coreFlash * 26 + G.coreGold * 40;
    // ghosts + slot sprite
    const act = activePiece();
    const showSlot = act && (state === ST.WAIT_INPUT || state === ST.WAIT_START || state === ST.DRAGGING || state === ST.SNAPPING);
    for (let s = 0; s < 3; s++) for (let k = 0; k < 6; k++) {
      const g = ghosts[s][k]; if (!g.mesh.visible) continue;
      const isAct = showSlot && s === G.stage && k === G.k;
      const tgt = isAct ? 0.55 + 0.3 * Math.sin(gameTime * 3.2) : 0.22;
      g.a += (tgt - g.a) * (1 - Math.exp(-dt * 5));
      g.gm.opacity = g.a * 0.16; g.em.opacity = g.a * 0.55;
    }
    if (showSlot) {
      const a = ARM(G.k);
      slotSprite.position.set(Math.cos(a) * RS[G.stage], Math.sin(a) * RS[G.stage], 0.3);
      slotSprite.material.color.copy(act.col);
      const o = 0.28 + 0.16 * Math.sin(gameTime * 3.2);
      slotSprite.material.opacity += (o - slotSprite.material.opacity) * (1 - Math.exp(-dt * 6));
      const sc = 1.3 + G.stage * 0.2; slotSprite.scale.set(sc, sc, 1);
    } else slotSprite.material.opacity *= Math.exp(-dt * 6);
    // beams
    for (const b of beams) {
      b.boost *= Math.exp(-dt * 2.2);
      b.amt += (b.target - b.amt) * (1 - Math.exp(-dt * 2.5));
      b.len += (b.lenT - b.len) * (1 - Math.exp(-dt * 0.8));
      b.mat.uniforms.uAmt.value = Math.min(1, b.amt + b.boost);
      b.mesh.scale.set(1.1 + b.len * 0.12, b.len, 1);
      b.mesh.visible = b.amt + b.boost > 0.005;
    }
    // ring wave & flashes
    if (G.ring) { G.ring.t += dt; const t = G.ring.t / G.ring.dur; CU.uRing.value.set(1.5 + t * 34, 0.55 * (1 - t) * Math.min(1, t * 8), 1.2 + t * 3); if (t >= 1) { G.ring = null; CU.uRing.value.y = 0; } }
    if (G.flashBoost) { G.flashBoost.t += dt; const t = G.flashBoost.t / G.flashBoost.dur; CU.uFlash.value = Math.max(CU.uFlash.value, 0.3 * Math.sin(Math.min(1, t) * Math.PI)); CU.uFlashCol.value.copy(G.flashBoost.col); if (t >= 1) G.flashBoost = null; }
    CU.uFlash.value *= Math.exp(-dt * 2.2);
    // camera & render
    updateCamera();
    sky.position.copy(camera.position);
    renderer.toneMappingExposure = G.expo;
    bloom.strength = Math.min(1.1, 0.32 + G.stage * 0.05 + G.bloomExtra);
    if (useBloom) composer.render(dt); else renderer.render(scene, camera);
    // status
    const T = window.__test;
    T.state = state; T.stage = G.stage; T.attached = G.total; T.fps = Math.round(FPS.shown * 10) / 10; T.errors = window.__errors.length; T.climaxT = G.clT; T.quality = qName;
    if (!window.__ready && G.readyFrames !== undefined) { G.readyFrames++; if (G.readyFrames > 2) { window.__ready = true; document.getElementById('ld').classList.add('off'); } }
  } catch (e) { logErr(e); }
}

// ---------------------------------------------------------------- boot
try {
  applyQuality(qName);
  palApply(0);
  skyUniforms.uTop.value.copy(CUR.top); skyUniforms.uHor.value.copy(CUR.hor); skyUniforms.uSunCol.value.copy(CUR.sun);
  buildEnv();
  resize();
  updateCamera();
  startStage(0, true);
  G.readyFrames = 0;
  requestAnimationFrame((t) => { last = t; frame(t); });
} catch (e) { logErr(e); }
</script>
<script src="../../gf-playlog.js" defer></script>
</body>
