// ---------------------------------------------------------------------------
// parameters
// ---------------------------------------------------------------------------
const QS = new URLSearchParams(location.search);
const AUTOTEST = QS.has('autotest');
const QF = (QS.get('q') || '').toLowerCase();
const FORCED = ['low', 'mid', 'high'].includes(QF) ? QF : null;

const PRESET = {

// ---------------------------------------------------------------------------
// small math / noise helpers
// ---------------------------------------------------------------------------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const easeInOut = t => { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
function hashI(x, y) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263);

const R = rng(20261127);

// ---------------------------------------------------------------------------
// renderer
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: qName !== 'low', powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, PRESET[qName].pr));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const SHADOWS = INIT_Q.shadow > 0;
renderer.shadowMap.enabled = SHADOWS;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const canvas = renderer.domElement;
canvas.setAttribute('aria-hidden', 'true');
document.body.appendChild(canvas);
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); window.__errors.push('webgl context lost'); });

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd9ebf4, 130, 720);
const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 1500);
camera.rotation.order = 'YXZ';

// ---------------------------------------------------------------------------
// palette (three stages, blended continuously)
// ---------------------------------------------------------------------------
const PAL = [
  { zen: '#69B7E8', hor: '#D9EBF4', sun: '#FFE5BA', lake: '#329EAE', grass: '#77AD48', mist: '#E0F5FF', sunI: 2.1, hemiI: 1.2, bloom: 0.25, cloud: 0.56, el: 22 },
  { zen: '#51B9EC', hor: '#FCE5B5', sun: '#FFDE99', lake: '#36B7C0', grass: '#8EC94D', mist: '#FFF1D5', sunI: 2.5, hemiI: 1.35, bloom: 0.45, cloud: 0.46, el: 30 },
  { zen: '#359FEA', hor: '#D1F2FF', sun: '#FFF1D2', lake: '#29C5CF', grass: '#94D75B', mist: '#E9FAFF', sunI: 2.8, hemiI: 1.5, bloom: 0.65, cloud: 0.34, el: 38 }
].map(p => ({ ...p, zen: new THREE.Color(p.zen), hor: new THREE.Color(p.hor), sun: new THREE.Color(p.sun), lake: new THREE.Color(p.lake), grass: new THREE.Color(p.grass), mist: new THREE.Color(p.mist) }));
const CUR = { zen: new THREE.Color(), hor: new THREE.Color(), sun: new THREE.Color(), lake: new THREE.Color(), grass: new THREE.Color(), mist: new THREE.Color(), sunI: 2, hemiI: 1.2, bloom: 0.25, cloud: 0.5, el: 22 };
function samplePalette(t) {
  t = clamp(t, 0, 2);
  const i = Math.min(1, Math.floor(t)), f = t - i, a = PAL[i], b = PAL[i + 1];
  for (const k of ['zen', 'hor', 'sun', 'lake', 'grass', 'mist']) CUR[k].copy(a[k]).lerp(b[k], f);
  for (const k of ['sunI', 'hemiI', 'bloom', 'cloud', 'el']) CUR[k] = lerp(a[k], b[k], f);
}
samplePalette(0);
const sunDir = new THREE.Vector3();
function setSunDir(elDeg) {
  const el = THREE.MathUtils.degToRad(elDeg), az = THREE.MathUtils.degToRad(31);
  sunDir.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)).normalize();
}
setSunDir(22);

// shared uniforms (all water related materials reference the same objects)
const U = {
  uTime: { value: 0 }, uOpen: { value: 0.04 }, uArch: { value: 0 }, uSurge: { value: 0 },
  uW2: { value: W2 }, uLip: { value: LIP }, uZ0: { value: Z0 }, uZimp: { value: ZIMP },
  uSunDir: { value: sunDir }, uSunCol: { value: new THREE.Color() }, uZenith: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() },
  uMist: { value: new THREE.Color() }, uLake: { value: new THREE.Color() }, uLight: { value: 1 },
  uFogColor: { value: new THREE.Color() }, uFogNear: { value: 130 }, uFogFar: { value: 720 }
};

// ---------------------------------------------------------------------------
// GLSL chunks
// ---------------------------------------------------------------------------
const GLSL_NOISE = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash12(i), hash12(i+vec2(1.0,0.0)), u.x), mix(hash12(i+vec2(0.0,1.0)), hash12(i+vec2(1.0,1.0)), u.x), u.y); }
float fbm(vec2 p){ float a = 0.5; float s = 0.0; for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; } return s / 0.97; }
float fbm3(vec2 p){ float a = 0.5; float s = 0.0; for (int i = 0; i < 3; i++){ s += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; } return s / 0.875; }
`;
const GLSL_GAP = `
uniform float uOpen; uniform float uArch; uniform float uW2; uniform float uLip; uniform float uZ0; uniform float uZimp; uniform float uSurge;
float gapHalf(float y){
  float h0 = uOpen * uW2;
  float k = clamp((y - 22.0) / (uLip - 22.0), 0.0, 1.0);
  float ap = sqrt(max(0.0, 1.0 - k * k));
  float prof = mix(1.0, max(ap, 0.07), uArch);
  float lipT = smoothstep(uLip - 1.0, uLip - 6.0, y);
  return h0 * prof * lipT;
}
float outerHalf(){ return uW2 + 2.5 * uOpen; }
`;
const GLSL_SKY = `
uniform vec3 uZenith; uniform vec3 uHorizon; uniform vec3 uSunDir; uniform vec3 uSunCol;
vec3 skyGrad(vec3 d){
  float t = clamp(d.y, 0.0, 1.0);
  vec3 c = mix(uHorizon, uZenith, pow(smoothstep(0.0, 0.6, t), 0.55));
  float s = max(dot(d, uSunDir), 0.0);
  c += uSunCol * (pow(s, 6.0) * 0.20 + pow(s, 48.0) * 0.45);
  return c;
}
`;
const GLSL_OUT = `
#include <tonemapping_fragment>
#include <colorspace_fragment>
`;

// ---------------------------------------------------------------------------
// procedural textures
// ---------------------------------------------------------------------------
function canvasTex(size, fill, srgb) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d'); const img = ctx.createImageData(size, size);
  fill(img.data, size);
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function normalTex(size, hfn, strength) {
  return canvasTex(size, (d, s) => {
    const h = new Float32Array(s * s);
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) h[y * s + x] = hfn(x, y, s);
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
      const dx = h[y * s + (x + 1) % s] - h[y * s + (x - 1 + s) % s];
      const dy = h[((y + 1) % s) * s + x] - h[((y - 1 + s) % s) * s + x];
      let nx = -dx * strength, ny = -dy * strength, nz = 1; const l = Math.hypot(nx, ny, nz);
      const i = (y * s + x) * 4; d[i] = (nx / l * 0.5 + 0.5) * 255; d[i + 1] = (ny / l * 0.5 + 0.5) * 255; d[i + 2] = (nz / l * 0.5 + 0.5) * 255; d[i + 3] = 255;
    }
  }, false);
}
const TS = 256;
const rockNormal = normalTex(TS, (x, y, s) => {
  const P = 16, u = x / s * P, v = y / s * P;
  let h = 0, a = 1, f = 1; for (let i = 0; i < 4; i++) { h += a * vnoise(u * f, v * f, P * f); f *= 2; a *= 0.5; }
  const cr = 1 - Math.abs(vnoise(u * 0.5 + 9, v * 0.5, P / 2) * 2 - 1);
  return h + Math.pow(cr, 8) * -0.8;
}, 5.0);
const stoneNormal = normalTex(TS, (x, y, s) => {
  const bw = s / 4, bh = s / 8, row = Math.floor(y / bh), off = (row % 2) * bw * 0.5;
  const lx = (x + off) % bw, ly = y % bh;
  const edge = Math.min(lx, bw - lx, ly, bh - ly);
  const P = 16; const n = vnoise(x / s * P, y / s * P, P) * 0.35 + vnoise(x / s * P * 4, y / s * P * 4, P * 4) * 0.15;
  return Math.min(1, edge / 3) + n;
}, 4.0);
const stoneAlbedo = canvasTex(TS, (d, s) => {
  const bw = s / 4, bh = s / 8;
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const row = Math.floor(y / bh), off = (row % 2) * bw * 0.5, col = Math.floor((x + off) / bw);
    const lx = (x + off) % bw, ly = y % bh, edge = Math.min(lx, bw - lx, ly, bh - ly);
    const P = 16; const n = vnoise(x / s * P, y / s * P, P);
    const blk = hashI(col, row);
    let r = 132 + blk * 26 + n * 22, g = 136 + blk * 22 + n * 20, b = 128 + blk * 16 + n * 16;
    if (edge < 2) { r *= 0.72; g *= 0.74; b *= 0.74; }
    const m = vnoise(x / s * 8, y / s * 8, 8);
    if (m > 0.68 && ly > bh * 0.55) { r = lerp(r, 104, 0.5); g = lerp(g, 140, 0.5); b = lerp(b, 70, 0.5); }
    const i = (y * s + x) * 4; d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
  }
}, true);
function spriteTex(size, fn) {
  const c = document.createElement('canvas'); c.width = c.height = size; const ctx = c.getContext('2d'); fn(ctx, size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const mistTex = spriteTex(128, (ctx, s) => {
  const img = ctx.createImageData(s, s);
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const dx = (x - s / 2) / (s / 2), dy = (y - s / 2) / (s / 2), r = Math.hypot(dx, dy);
    const n = fbm(x / s * 4, y / s * 4, 4);
    const a = Math.max(0, 1 - r) ** 1.6 * (0.45 + 0.75 * n);
    const i = (y * s + x) * 4; img.data[i] = 255; img.data[i + 1] = 255; img.data[i + 2] = 255; img.data[i + 3] = clamp(a, 0, 1) * 255;
  }
  ctx.putImageData(img, 0, 0);
});
const haloTex = spriteTex(64, (ctx, s) => {
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,240,190,1)'); g.addColorStop(0.35, 'rgba(255,210,120,0.45)'); g.addColorStop(1, 'rgba(255,200,100,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
});
function wingTex(c1, c2, c3) {
  return spriteTex(128, (ctx, s) => {
    ctx.clearRect(0, 0, s, s);
    const g = ctx.createRadialGradient(s * 0.1, s * 0.5, 4, s * 0.1, s * 0.5, s * 0.95);
    g.addColorStop(0, c1); g.addColorStop(0.55, c2); g.addColorStop(1, c3);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(s * 0.5, s * 0.34, s * 0.46, s * 0.3, -0.35, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * 0.42, s * 0.74, s * 0.32, s * 0.22, 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(s * 0.74, s * 0.26, s * 0.05, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.6, s * 0.2, s * 0.035, 0, Math.PI * 2); ctx.fill();
  });
}

// ---------------------------------------------------------------------------
// lights + environment
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xD8EEFF, 0xA3AA86, 1.2);
const HEMI_K = 0.8;
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xFFE5BA, 2.1);
sun.target.position.set(0, 10, -170);
scene.add(sun, sun.target);
if (SHADOWS) {
  sun.castShadow = true;
  sun.shadow.mapSize.set(INIT_Q.shadow, INIT_Q.shadow);
  const sc = sun.shadow.camera; sc.left = -120; sc.right = 120; sc.top = 120; sc.bottom = -120; sc.near = 10; sc.far = 1200;
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.4;
}
const fill = new THREE.DirectionalLight(0xfff0dc, 1.15);
fill.position.set(-0.55, 0.75, 0.6).multiplyScalar(100);
scene.add(fill);

// sky dome
const skyMat = new THREE.ShaderMaterial({
  uniforms: { uZenith: U.uZenith, uHorizon: U.uHorizon, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uTime: U.uTime, uCloud: { value: 0.5 }, uGlow: { value: 1 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: GLSL_NOISE + GLSL_SKY + `
  uniform float uTime; uniform float uCloud; uniform float uGlow; varying vec3 vDir;
  void main(){
    vec3 d = normalize(vDir);
    float h = d.y;
    vec3 col = skyGrad(d);
    if (h < 0.0) col = uHorizon * 0.96;
    float s = max(dot(d, uSunDir), 0.0);
    col += uSunCol * (pow(s, 900.0) * 6.0 + pow(s, 14.0) * 0.18 * uGlow);
    if (h > 0.0) {
      vec2 uv = d.xz / (h + 0.1) * 1.25 + vec2(uTime * 0.0045, uTime * 0.0016);
      float c = fbm(uv * 1.15);
      float c2 = fbm(uv * 1.15 + uSunDir.xz * 0.07);
      float cov = smoothstep(1.0 - uCloud, 1.0 - uCloud + 0.3, c) * smoothstep(0.015, 0.16, h);
      float shade = clamp(0.6 + (c - c2) * 5.0, 0.0, 1.0);
      vec3 cc = mix(vec3(0.60, 0.68, 0.80), vec3(1.0, 0.99, 0.97), shade);
      cc += uSunCol * pow(s, 4.0) * 0.55 * (1.0 - cov * 0.5);
      cc = mix(cc, uHorizon, smoothstep(0.22, 0.0, h) * 0.6);
      col = mix(col, cc, cov * 0.9);
    }
    gl_FragColor = vec4(col, 1.0);
  ` + GLSL_OUT + `}`,
  side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false
});
const skyGeo = new THREE.SphereGeometry(1300, 48, 24);
const sky = new THREE.Mesh(skyGeo, skyMat);
sky.renderOrder = -100; sky.frustumCulled = false;
scene.add(sky);

const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
const envSky = new THREE.Mesh(skyGeo, skyMat); envScene.add(envSky);
const envGround = new THREE.Mesh(new THREE.CircleGeometry(900, 24).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x6f8a62 }));
envGround.position.y = -40; envScene.add(envGround);
let envRT = null, envT = -9;
function refreshEnv(t) {
  const old = envRT;
  envRT = pmrem.fromScene(envScene, 0, 1, 2000);
  scene.environment = envRT.texture;
  if (old) old.dispose();
  envT = t;
}

// ---------------------------------------------------------------------------
// terrain
// ---------------------------------------------------------------------------
const LAKE_BACK = -84;
function shoreX(z) { return 92 + 26 * (fbm(z * 0.012, 4.2, 3) - 0.5); }
function hillsH(x, z) {
  const ax = Math.abs(x), se = ax - shoreX(z);
  if (se < -12) return 0;
  const k = smooth(-12, 30, se);
  return k * (5 + Math.min(Math.max(se, 0), 140) * 0.3) * (0.65 + 0.7 * fbm(x * 0.015, z * 0.015, 4));
}
function streamX(z) { return 9 * Math.sin(z * 0.024 + 0.6) + 4 * Math.sin(z * 0.071); }
function meadowH(x, z) {
  const ax = Math.abs(x), dz = LAKE_BACK - z;
  let m = 1.2 + Math.min(Math.max(dz, 0), 160) * 0.17 + 1.6 * (fbm(x * 0.03, z * 0.03, 3) - 0.3);
  const sd = Math.abs(x - streamX(z));
  if (sd < 3.2 && z > -246) m -= 0.9 * (1 - (sd / 3.2) ** 2);
  const lk = smooth(-236, -252, z) * smooth(-348, -332, z) * (1 - smooth(95, 128, ax + 10 * vnoise(z * 0.03, 2)));
  m = lerp(m, 22.5, lk);
  const vw = smooth(55, 150, ax + 22 * (fbm(z * 0.01, 1.3, 2) - 0.5));
  m += vw * (30 + 120 * ridged(x * 0.006, z * 0.006, 5));
  const mt = smooth(-335, -480, z);
  m += mt * (55 + 240 * ridged(x * 0.0042 + 3.1, z * 0.0042, 6)) * (0.7 + 0.55 * smooth(20, 320, ax));
  return m;
}
function terrainH(x, z) {
  const hills = hillsH(x, z);
