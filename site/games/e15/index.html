canvas.addEventListener('pointerdown', onDown, { passive: false });
window.addEventListener('pointermove', onMove, { passive: true });
window.addEventListener('pointerup', onUp);

// =====================================================================
// feeder animation, guidance, state machine
// =====================================================================
function updateFeeder(dt) {
  const fd = G.feeder;
  if (!fd) { halo.material.opacity = Math.max(0, halo.material.opacity - dt * 2); sheen.visible = false; return; }
  const mb = fd.mb; mb.shell.material = shellFor(mb);
  if (G.state === 'WAITING') {
    fd.t += dt; const e = sstep(0, 1, fd.t / 0.6);
    if (fd.t >= 0.6) fd.ready = true;
    mb.g.scale.setScalar(Math.max(0.01, e));
    const base = _tmp.copy(FEED_POS).lerp(INLET, fd.drag * 0.45); base.y -= (1 - e) * 0.35;
    let wig = 0;

    G.idleT += dt;

    halo.position.copy(mb.g.position); halo.material.opacity = (0.28 + 0.22 * pulse) * e; halo.scale.setScalar(1.3 + pulse * 0.25);
    halo.material.color.setHSL(fd.rain ? (G.time * 0.15) % 1 : 0.1, fd.rain ? 0.8 : 0.7, 0.75);
    sheen.visible = true; sheen.position.copy(mb.g.position);
    sheenU.uPulse.value = 0.25 + 0.35 * pulse;
    if (G.idleT > 2) { const ph = ((G.idleT - 2) % 1.8) / 1.8; sheenU.uBand.value = -1.6 + ph * 3.2; sheenU.uAmp.value = Math.sin(ph * Math.PI); } else sheenU.uAmp.value = 0;
    if (G.idleT > 4) { rimU.uRim.value = Math.max(rimU.uRim.value, 0.9); rimU.uRimPos.value = (G.idleT * 0.6) % 1; }
  } else if (G.state === 'LAUNCH') {
    G.stateT += dt; const f = Math.min(1, G.stateT / 0.5); const e = f * f;
    mb.g.position.lerpVectors(fd.launchFrom, INLET, e); mb.g.position.y += Math.sin(f * Math.PI) * 0.12;
    _qr.setFromAxisAngle(_tmp2.set(1, 0, 0), -dt * 9); mb.g.quaternion.premultiply(_qr);

function updateState(dt) {
  G.mechT = Math.max(0, G.mechT - dt);

  } else if (G.state === 'STAGE_UP') {
    G.stateT += dt;
    if (G.stateT > 0.2 && !G.su1) { G.su1 = true; padChord(G.stage + 1); }
    G.envF = lerp(G.stage, G.stage + 1, sstep(0.2, 2.6, G.stateT));
    applyEnv();
    if (G.stateT > 2.8) {
      G.stage++; G.envF = G.stage; applyEnv(); regenEnv(); G.su1 = false;

// =====================================================================
// autotest (drives the normal pointer path)
// =====================================================================
const AT = { wait: 0, busy: false, n: 0, queue: [], outsideDone: false, secondDone: false, finishedLogged: false };

// =====================================================================
// test info
// =====================================================================
const TESTPTS = [new V3(WHEEL_C.x + WHEEL_R, WHEEL_C.y, WHEEL_C.z), new V3(WHEEL_C.x, WHEEL_C.y + WHEEL_R, WHEEL_C.z), new V3(TOWER.x, 12.6, TOWER.z), new V3(ELEV_X, 12.2, ELEV_Z), new V3(DISH.x, DISH.y + 0.7, DISH.z), FEED_POS];

// =====================================================================
// main loop
// =====================================================================
function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
  computeFrames();
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(window.innerWidth, window.innerHeight); }
  updateScales();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// pre-advance for checking (not used by autotest)
function preAdvance(n) {
  for (const id in FEAT) { const f = FEAT[id]; if (f.act <= n) { f.on = true; if (f.onFirst) f.onFirst(); } }
  for (const b of BELLS) if (b.act <= n + 1 && b.act < 99) { b.shown = true; b.g.visible = true; b.showT = 1; b.g.scale.setScalar(1); }
  G.arrived = n; G.stage = Math.min(3, Math.floor(n / 6)); G.envF = G.stage;
  for (let i = 0; i < n; i++) storedColors.push(i % COLORS.length);
  towerU.uFill.target = towerU.uFill.value = 0.03 + 0.97 * n / 24;
  G.brassGlow = 0; for (const k in RMAT) RMAT[k].userData.u.uGlow.value = 0;
  if (n >= 18) { G.rainTarget = 0.5; G.rainSpanTarget = 0.5; }

applyQuality(qName);
applyEnv();
regenEnv();
computeFrames();
if (PRE > 0) { preAdvance(PRE); applyEnv(); regenEnv(); padChord(G.stage); }

let last = performance.now(); G.frames = 0; let fpsShow = 60;

    const dt = Math.min(raw, AUTOTEST ? 0.25 : 0.1) * TIME_SCALE;

    mistMat.uniforms.uTime.value = G.time;

      updateClimax(h);

} catch (e) {

}
