  await sleep(1500);
  TEST.finished = true; console.log('[autotest] finished plays=' + G.plays + ' ignored=' + G.ignored + ' outside=' + G.outside);
}

// ================================================================ boot
function applyPre() {
  if (!PRE) return;
  G.count = PRE >= 20 ? 19 : PRE; G.stage = Math.min(3, Math.floor(G.count / 5)); G.tod = G.todTarget = G.stage; flowerGrow.value = 0.82 + 0.06 * G.stage;
  for (let i = 0; i < G.count % 5; i++) G.played[i] = true;
  if (PRE >= 20) { G.count = 20; G.played.fill(true); G.mode = 'CLIMAX'; G.climaxReached = true; G.climaxT = 0; G.phase = 'REFILLING'; G.refT = 0; G.refFrom = 1; G.c = 1; }
}
if (URLP.has('dbg')) window.__dbg = { scene, camera, flowerMeshes, THREE };
function boot() {
  applyPre();
  setupPost(); onResize(); evalTOD(G.tod); applyTOD(); regenEnv(); envTod = G.tod;
  if (A.ctx) SFX.stageTimbre(G.stage);
  // fast-forward climax for stills
  if (PRE >= 20 && PRE_CT > 0) { let t = 0; while (t < PRE_CT) { gt += 0.05; WU.uTime.value = gt; updateGame(0.05); updateParticles(0.05); t += 0.05; } }
  requestAnimationFrame(t => { last = t; frame(t); requestAnimationFrame(() => requestAnimationFrame(() => {
    window.__ready = true; const ld = document.getElementById('ld'); if (ld) { ld.style.opacity = '0'; setTimeout(() => ld.remove(), 1000); }
    console.log('[e11] ready q=' + qName);
    if (AUTOTEST) autoRun().catch(e => window.__errors.push('autotest: ' + (e && e.message || e)));
  })); });
}
boot();
