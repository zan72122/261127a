// ============================================================ helpers

uniform float uTime; uniform float uDap; varying vec3 vDapW;
float dappleAt(vec3 w){
  float fade = 1.0 - smoothstep(5.0, 16.0, length(w.xz - vec2(0.0,-2.0)));

// ============================================================ terrain
const VC = { x: 0, z: -8 };
