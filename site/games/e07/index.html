const AT_ID = 7001;

function atEv(x, y) { return { pointerId: AT_ID, clientX: x, clientY: y, pointerType: 'touch', cancelable: true, preventDefault() {} }; }
function sectorPath(s, pass) {
  const ring = Math.floor(s / 7), k = s % 7, [r0, r1] = RING_R[ring];
  const a0 = k / 7 * TAU - RING_OFF[ring], a1 = (k + 1) / 7 * TAU - RING_OFF[ring];
  const w = STAGE_W[ring] * 0.72;
  const ra = ring === 3 ? 0.3 : r0 + 0.25, rb = r1 - 0.22;
  const pts = [];
  let dirF = true;
  for (let r = ra + (pass % 2) * w * 0.5; r <= rb + 1e-3; r += w) {
    const steps = Math.max(2, Math.ceil((a1 - a0) * r / 0.22));
    for (let i = 0; i <= steps; i++) { const t = dirF ? i / steps : 1 - i / steps; const a = lerp(a0 + 0.03, a1 - 0.03, t); pts.push({ x: Math.cos(a) * r, z: Math.sin(a) * r }); }
    dirF = !dirF;
  }
  return pts;
}
function autotestStep(dt) {
  AT.t += dt;
  const P = AT;
  switch (P.phase) {
    case 'wait': if (P.t > 1.2 && window.__ready) { const s = wToS(B.vis.x, B.vis.y, B.vis.z); onDown(atEv(s.x, s.y)); P.phase = 'tapup'; P.t = 0; } break;
    case 'tapup': if (P.t > 0.18) { onUp(atEv(0, 0)); P.phase = 'next'; P.t = 0; } break;
    case 'next': {
      if (G.state !== 'PLAY') { if (G.state === 'CLIMAX') { P.phase = 'climax'; } break; }
      const s = P.order.find(i => !G.done[i]);
      if (s === undefined) { P.phase = 'climax'; break; }
      P.sector = s; P.passes = 0; P.path = sectorPath(s, 0); P.pi = 0; P.pt = 0;
      const ring = Math.floor(s / 7);
      if (ring === 1 && s % 7 === 0) { P.taps = P.path.filter((_, i) => i % 4 === 0); P.phase = 'tap'; P.t = 0; P.pi = 0; break; }
      P.hold = (s % 7 === 3) ? 1.3 : 0;
      const sp = wToS(P.path[0].x, 0.12, P.path[0].z); onDown(atEv(sp.x, sp.y)); P.phase = 'sweep'; break;
    }
    case 'tap': {
      if (G.done[P.sector]) { if (ptr.down) onUp(atEv(0, 0)); P.phase = 'pause'; P.t = 0; break; }
      if (P.pi >= P.taps.length) { if (ptr.down) onUp(atEv(0, 0)); P.path = sectorPath(P.sector, 1); P.pi = 0; P.pt = 0; const sp = wToS(P.path[0].x, 0.12, P.path[0].z); onDown(atEv(sp.x, sp.y)); P.phase = 'sweep'; break; }
      if (!ptr.down && P.t > 0.12) { const q = P.taps[P.pi]; const sp = wToS(q.x, 0.12, q.z); onDown(atEv(sp.x, sp.y)); P.t = 0; }
      else if (ptr.down && P.t > 0.14) { onUp(atEv(0, 0)); P.t = 0; P.pi++; }
      break;
    }
    case 'sweep': {
      if (G.done[P.sector]) { onUp(atEv(0, 0)); P.phase = 'pause'; P.t = 0; break; }
      if (P.hold > 0 && P.pi > P.path.length / 2) { P.hold -= dt; break; }
      P.pt += dt * 2.6 / 0.22;
      while (P.pt >= 1 && P.pi < P.path.length - 1) { P.pt -= 1; P.pi++; }
      const q = P.path[Math.min(P.pi, P.path.length - 1)];
      const sp = wToS(q.x, 0.12, q.z); onMove(atEv(sp.x, sp.y));
      if (P.pi >= P.path.length - 1) {
        P.passes++;
        if (P.passes > 4) { onUp(atEv(0, 0)); P.phase = 'pause'; P.t = 0; break; }
        P.path = sectorPath(P.sector, P.passes); P.pi = 0; P.pt = 0;
      }
      break;
    }
    case 'pause': if (P.t > 0.5) { P.phase = 'next'; P.t = 0; } break;
    case 'climax': if (G.state === 'FREE_PLAY') { P.phase = 'free'; P.t = 0; const s = wToS(3, 0.12, 2); onDown(atEv(s.x, s.y)); } break;
    case 'free': {
      const a = P.t * 1.4; const s = wToS(Math.cos(a) * 4, 0.12, Math.sin(a) * 4 + 0.5); onMove(atEv(s.x, s.y));
      if (P.t > 2.2) { onUp(atEv(0, 0)); P.phase = 'idle'; P.t = 0; }
      break;
    }
    case 'idle': if (G.state === 'INTRO' && TEST.intro2) { P.phase = 'end'; TEST.finished = true; } break;
  }
}

// ---------------------------------------------------------------- loop
applyQuality(qName);
evalTod(0); updateLighting(0); regenEnv(); uploadMask();
let last = performance.now(), time = 0, frames = 0, fpsAcc = 0, fpsN = 0;
function frame(now) {
  const raw = Math.max(0.0001, (now - last) / 1000); last = now;
  const dt = Math.min(raw, AUTOTEST ? 0.25 : 0.1);
  time += dt;
  try {
    if (AUTOTEST) autotestStep(dt);
    updateBlower(dt, time);
    updateGame(dt, time);
    if (maskDirty) uploadMask();
    updatePools(dt);
    updateLighting(dt);
    updateCamera(dt);
    clouds.children.forEach(c => { c.position.x += 0.35 * dt; });
    tileU.uTime.value = time;
    audioFrame(B.blow * (G.state === 'PLAY' || G.state === 'FREE_PLAY' ? 1 : 0.4), Math.max(B.fan, B.blow), B.speed);
    if (composer && QS[qName].bloom > 0) composer.render(dt); else renderer.render(scene, cam);
  } catch (err) { if (window.__errors.length < 20) window.__errors.push('frame: ' + (err && err.message || err)); }
  frames++;
  if (frames === 3) { window.__ready = true; TEST.ready = true; const ld = document.getElementById('ld'); if (ld) { ld.style.opacity = '0'; setTimeout(() => ld.remove(), 900); } }
  fpsAcc += raw; fpsN++; if (fpsAcc > 1) { TEST.fps = +(fpsN / fpsAcc).toFixed(1); fpsAcc = 0; fpsN = 0; }
  qualityMonitor(raw);
  TEST.state = stateName(); TEST.stage = Math.min(4, G.stage + 1); TEST.done = G.doneCount; TEST.climaxT = +G.climaxT.toFixed(2); TEST.frames = frames;
  TEST.particles = sandPool.n + dustPool.n + lightPool.n;
}
renderer.setAnimationLoop(frame);
if (AUTOTEST || URLP.has('dbg')) window.__dbg = { G, B, CS, TOD, secRemain, secInit, mask };
</script>
