function leafGeo(len, wid, sl, sw, fold, droop, shape) {
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= sl; i++) {
    const u = i / sl, w = wid * shape(u);
    for (let j = 0; j <= sw; j++) {
      const v = j / sw * 2 - 1;
      pos.push(v * w, -droop * len * u * u + fold * Math.abs(v) * w, u * len);
      uv.push(v * 0.5 + 0.5, u);
    }
  }
  for (let i = 0; i < sl; i++) for (let j = 0; j < sw; j++) { const a = i * (sw + 1) + j, b = a + sw + 1; idx.push(a, b, a + 1, a + 1, b, b + 1); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}

    AT.q.push({ at: t0 + 1.0, fn: () => { const b = toFn(); onUp(fakeEv(b.x, b.y)); AT.busy = false; } });
    return;
  }
  const N = 8;
  for (let i = 1; i <= N; i++) AT.q.push({ at: t0 + 0.1 + dur * i / N, fn: () => { if (!ptr) return; const b = toFn(); const e = easeOut(i / N); onMove(fakeEv(lerp(a.x, b.x, e), lerp(a.y, b.y, e) + 34)); } });
  AT.q.push({ at: t0 + 0.2 + dur, fn: () => { const b = toFn(); onUp(fakeEv(b.x, b.y + 34)); AT.busy = false; } });
}
function autotest(dt) {
  if (!AUTOTEST) return;
  AT.t += dt;
  while (AT.q.length && AT.q[0].at <= AT.t) { const a = AT.q.shift(); try { a.fn(); } catch (e) { logErr(e); } }
  if (AT.busy || AT.q.length) return;
  if ((state === ST.READY || state === ST.SELECT) && stateT > 2.0 && idleT > 0.6) {
    const ready = cands.filter(c => c.mode === 'home');
    if (!ready.length) return;
    const p = ready[placed % ready.length];
    planDrag(p, () => screenOf(slotWorld(activeSlot)), 0.9, placed % 4 === 3);
  } else if (state === ST.FREEPLAY && idleT > 1.5) {
    if (AT.free === 0) {
      const p = cands.find(c => c.mode === 'home'); if (!p) return;
      AT.free = 1; planDrag(p, () => screenOf(slotWorld(slots[7])), 1.0, false);
    } else if (AT.free === 1 && T.replaced > 0) {
      AT.free = 2; const w = screenOf(wheel.position).clone();
      AT.q.push({ at: AT.t + 0.1, fn: () => onDown(fakeEv(w.x, w.y)) }, { at: AT.t + 0.2, fn: () => onUp(fakeEv(w.x, w.y)) });
    } else if (AT.free === 2 && T.wheel > 0 && openT > 4) { AT.free = 3; T.done = true; }
  }
}

// ============================================================ main loop
const ld = document.getElementById('ld');
let last = performance.now(), frames = 0, fpsAcc = 0, fpsShow = 60, readyDone = false;
window.__test = {};
function publish() {
  const t = window.__test;
  t.state = state; t.placed = placed; t.stage = stage; t.q = qName; t.fps = Math.round(fpsShow * 10) / 10;
  t.climaxReached = T.climaxReached; t.climaxT = Math.round(climaxT * 10) / 10; t.afterglowReached = T.afterglowReached; t.freeplayReached = T.freeplayReached;
  t.replaced = T.replaced; t.wheel = T.wheel; t.done = T.done; t.errors = window.__errors.length;
  t.tod = Math.round(tod * 100) / 100; t.stateT = Math.round(stateT * 10) / 10;
}
function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.max(0, (now - last) / 1000); last = now;
  frames++; fpsAcc += raw; if (fpsAcc > 1) { fpsShow = frames / fpsAcc; frames = 0; fpsAcc = 0; }
  const dt = Math.min(raw, AUTOTEST ? 0.25 : 0.1);
  try {
    autotest(dt);
    update(dt);
    render();
    autoQuality(raw);
    publish();
    if (!readyDone) { readyDone = true; window.__ready = true; ld.classList.add('off'); setTimeout(() => { ld.style.display = 'none'; }, 1300); }
  } catch (e) { logErr(e); }
}
try {
  applyPlantDensity(QUAL[qName].plant);
  evalTod(0); computeSunDir(); rebuildEnv(); envStage = 0;
  startGame();
  applyQuality(qName);
  updateCamTarget();
  if (AUTOTEST || QS.has('dbg')) window.__dbg = { get state() { return state; }, slots, cands, camera, T, ENV };
  requestAnimationFrame(frame);
} catch (e) { logErr(e); }
</script>
