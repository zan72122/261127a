// ================================================================ params
const URLP = new URLSearchParams(location.search);
const AUTOTEST = URLP.has('autotest');
const QF = ['low', 'mid', 'high'].includes(URLP.get('q')) ? URLP.get('q') : null;
const QS = {
  low:  { pr: 1.0,  near: 10000, far: 8000,  shadow: 512,  grid: 128, bloom: 0, seeds: 80,  cloud: 2, aa: 0 },
  mid:  { pr: 1.25, near: 18000, far: 22000, shadow: 1024, grid: 192, bloom: 1, seeds: 250, cloud: 3, aa: 2 },

const FOV = 46;

const NEAR_MAX = 36000, FAR_MAX = 44000, SEED_MAX = 600;

// ================================================================ utils
let seed = 20261127;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ================================================================ renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.5, 1000);

// ================================================================ palette (3 stages)
const PAL = {
  skyTop:  ['#4798D5', '#599FD8', '#648FCC'],
  horizon: ['#D8EDF5', '#F4DDB1', '#FFD39A'],
  sun:     ['#FFF1D0', '#FFE0A0', '#FFD08A'],
  root:    ['#957032', '#99712B', '#A07830'],
  mid:     ['#C8A044', '#D8AD48', '#DDB34E'],
  tip:     ['#E8C76F', '#F2D17B', '#FFE2A0'],
  farHill: ['#AAB7B7', '#B9B1B8', '#B6A8BC'],
  blade:   ['#F5F4EA', '#FFF4DF', '#FFF1D7'],

const PALC = {};
for (const k in PAL) PALC[k] = PAL[k].map(h => new THREE.Color(h));
function palAt(k, p, out) {
  const a = PALC[k]; const i = Math.min(1, Math.floor(p)); const t = clamp(p - i, 0, 1);
  return out.copy(a[i]).lerp(a[i + 1], t);

// ================================================================ world layout: windmill path
const MILLS = 15;
const path = [];
{
  let x = 0, z = 0, th = 0;
  for (let i = 0; i < MILLS; i++) {
    path.push({ x, z, th });
    const sp = i < 4 ? 37 : i < 9 ? 45 : 54;
    const fx = -Math.sin(th), fz = -Math.cos(th);
    const rx = Math.cos(th), rz = -Math.sin(th);
    x += (rx * 0.76 + fx * 0.65) * sp;
    z += (rz * 0.76 + fz * 0.65) * sp;
    th -= 10 * DEG;
  }
  let cx = 0, cz = 0;
  for (const p of path) { cx += p.x; cz += p.z; }
  cx /= MILLS; cz /= MILLS;
  for (const p of path) { p.x -= cx; p.z -= cz; }
}
// hills: one gentle hill under each windmill + extra rolling hills
const hills = [];
for (const p of path) hills.push({ x: p.x + RR(-6, 6), z: p.z + RR(-6, 6), h: RR(8, 14), s: RR(26, 36) });
const camSpots = path.map(p => ({ x: p.x + Math.sin(p.th) * 70, z: p.z + Math.cos(p.th) * 70 }));
for (let n = 0, guard = 0; n < 16 && guard < 400; guard++) {
  const hx = RR(-370, 370), hz = RR(-370, 370);
  let ok = true;
  for (const c of camSpots) if (Math.hypot(hx - c.x, hz - c.z) < 60) ok = false;
  for (const p of path) if (Math.hypot(hx - p.x, hz - p.z) < 40) ok = false;
  if (!ok) continue;
  hills.push({ x: hx, z: hz, h: RR(10, 35), s: RR(40, 80) });
  n++;
}
function H(x, z) {
  let y = 3.5 * Math.sin(x * 0.011 + 1.3) * Math.cos(z * 0.009 + 0.4)
        + 2.2 * Math.sin(x * 0.023 - z * 0.017 + 2.0)
        + 1.2 * Math.sin(x * 0.041 + z * 0.037);
  for (let i = 0; i < hills.length; i++) {
    const h = hills[i], dx = x - h.x, dz = z - h.z;
    const d2 = dx * dx + dz * dz, s2 = 2 * h.s * h.s;
    if (d2 < s2 * 9) y += h.h * Math.exp(-d2 / s2);
  }
  y += 0.7 * vnoise(x * 0.05, z * 0.05);
  return y;
}
const INNER = 380;
function Hout(x, z) {
  const r = Math.hypot(x, z);
  const m = Math.max(Math.abs(x), Math.abs(z));
  let y = H(x, z);
  const ring = sstep(420, 900, r);
  if (ring > 0) {
    const a = Math.atan2(z, x);
    y += ring * (22 + 16 * Math.sin(a * 5 + 1.1) + 12 * Math.sin(a * 11 + r * 0.004) + 10 * vnoise(x * 0.006, z * 0.006));
  }
  return y - 2.5 * (1 - sstep(INNER - 14, INNER, m)) - 0.2;

// ================================================================ shared GLSL
const GLSL_NOISE = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

  return mix(mix(hash12(i), hash12(i+vec2(1.0,0.0)), u.x), mix(hash12(i+vec2(0.0,1.0)), hash12(i+vec2(1.0,1.0)), u.x), u.y); }
`;

#define NW ${NW}
uniform vec4 uWa[NW];
uniform vec4 uWb[NW];
uniform float uTime;
uniform vec2 uAmbDir;
uniform float uAmb;
uniform float uMaxBend;
// xy: bend vector (radians), z: sheen, w: signed swell
vec4 windAt(vec2 p){

  float g1 = sin(dot(p, uAmbDir) * 0.11 - uTime * 1.7 + sin(p.x * 0.031 + p.y * 0.023) * 2.0) * 0.5 + 0.5;
  float g2 = sin(dot(p, vec2(-uAmbDir.y, uAmbDir.x)) * 0.07 + uTime * 0.9) * 0.5 + 0.5;
  b += uAmbDir * uAmb * (0.45 + 0.9 * g1 * g2 + 0.3 * g1);
  sw += (g1 * g2 - 0.3) * 0.25;
  for (int i = 0; i < NW; i++) {
    vec4 a = uWa[i];
    if (a.w <= 0.0) continue;
    vec4 c = uWb[i];
    float age = uTime - a.z;
    if (age < 0.0) continue;
    vec2 dir; float d; float env = a.w;
    if (c.z < 0.5) { vec2 q = p - a.xy; d = length(q); dir = q / (d + 0.001); env *= 1.0 / (1.0 + d * 0.006) * smoothstep(0.0, 2.5, d); }
    else { dir = vec2(cos(c.w), sin(c.w)); d = dot(p - a.xy, dir); }
    float s = (c.x * age - d) / c.y;
    if (s < -3.0 || s > 10.0) continue;
    float f = exp(-s * s);
    float tail = s > 0.0 ? -0.3 * sin(1.7 * s) * exp(-0.42 * s) : 0.0;
    b += dir * env * (f + tail);
    float k = s - 0.2;
    sh += env * exp(-k * k * 1.4);
    sw += env * (f + tail);
  }
  float m = length(b);
  if (m > uMaxBend) b *= uMaxBend / m;
  return vec4(b, sh, sw);
}
`;
const windU = {
  uWa: { value: Array.from({ length: NW }, () => new THREE.Vector4(0, 0, 0, 0)) },
  uWb: { value: Array.from({ length: NW }, () => new THREE.Vector4(1, 1, 0, 0)) },
  uTime: { value: 0 },
  uAmbDir: { value: new THREE.Vector2(0.94, -0.34).normalize() },
  uAmb: { value: 0.075 },
  uMaxBend: { value: 0.70 },
};
const envU = {
  uSunDir: { value: new THREE.Vector3(0.5, 0.6, -0.5).normalize() },
  uSunCol: { value: new THREE.Color() },
  uSunI: { value: 0.8 },
  uHemiI: { value: 0.55 },
  uSkyC: { value: new THREE.Color('#D5E9FF') },
  uGroundC: { value: new THREE.Color('#B89A60') },
  uRoot: { value: new THREE.Color() },
  uMid: { value: new THREE.Color() },
  uTip: { value: new THREE.Color() },
  uFogCol: { value: new THREE.Color() },
  uFogN: { value: 130 },
  uFogF: { value: 560 },
  uCamPos: { value: new THREE.Vector3() },
  uSheenK: { value: 1.0 },
};

// ================================================================ sky
const skyU = {
  uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uFogC: envU.uFogCol,
  uSunDir: envU.uSunDir, uSunCol: envU.uSunCol, uTime: windU.uTime,
  uCloudShade: { value: new THREE.Color('#a9b7cc') }, uOct: { value: Q.cloud },
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position = p.xyww; }`,
  fragmentShader: `
  uniform vec3 uTop, uHor, uFogC, uSunDir, uSunCol, uCloudShade; uniform float uTime; uniform int uOct;
  varying vec3 vDir;
  ${GLSL_NOISE}
  float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ if (i >= uOct) break; v += a * vnoise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return v; }
  void main(){
    vec3 d = normalize(vDir);
    float h = d.y;
    vec3 col = mix(uHor, uTop, pow(smoothstep(-0.01, 0.26, h), 0.55));
    col = max(mix(vec3(dot(col, vec3(0.3, 0.55, 0.15))), col, 1.2), 0.0);
    col = mix(col, uFogC, smoothstep(0.035, -0.05, h));
    float sd = max(dot(d, uSunDir), 0.0);
    col += uSunCol * (pow(sd, 7.0) * 0.22 + pow(sd, 90.0) * 0.35);
    col += uSunCol * smoothstep(0.99955, 0.99975, sd) * 5.0;
    if (h > 0.005) {
      vec2 uv = d.xz / (h + 0.12) * 1.15 + vec2(uTime * 0.0035, uTime * 0.0012);
      float n = fbm(uv);
      float den = smoothstep(0.47, 0.78, n) * smoothstep(0.03, 0.2, h);
      float n2 = fbm(uv + normalize(uSunDir.xz + 1e-4) * 0.07);
      float lit = clamp((n - n2) * 5.0 + 0.55, 0.0, 1.0);
      vec3 cc = mix(uCloudShade, uSunCol * 1.05, lit);
      cc += uSunCol * pow(sd, 6.0) * 0.35 * (1.0 - den);
      col = mix(col, cc, den * 0.82);
    }
    gl_FragColor = vec4(col, 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`,

const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 24), skyMat);
sky.frustumCulled = false; sky.renderOrder = -10;
scene.add(sky);
// environment scene (for reflections)
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat));
const envGround = new THREE.Mesh(new THREE.CircleGeometry(48, 24).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x9a7a3a }));
envGround.position.y = -2; envScene.add(envGround);
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null, envP = -9;
function refreshEnv(p) {
  envP = p;
  envGround.material.color.copy(PALC.mid[Math.min(2, Math.round(p))]).multiplyScalar(0.55);
  const rt = pmrem.fromScene(envScene, 0, 0.1, 100);

}

// ================================================================ lights
const hemi = new THREE.HemisphereLight(0xD5E9FF, 0xB89A60, 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(Q.shadow, Q.shadow);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60; sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 420;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.4;
scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight(0xfff2e0, 0.55);
scene.add(fill); scene.add(fill.target);

// ================================================================ terrain
const heightTex = (() => {
  const N = 513, step = INNER * 2 / (N - 1);
  const data = new Uint16Array(N * N);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) data[j * N + i] = THREE.DataUtils.toHalfFloat(H(-INNER + i * step, -INNER + j * step));
  const t = new THREE.DataTexture(data, N, N, THREE.RedFormat, THREE.HalfFloatType);

})();
const terrainMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.92, metalness: 0.0, envMapIntensity: 0.18 });
terrainMat.onBeforeCompile = (sh) => {
  Object.assign(sh.uniforms, windU, { uRoot: envU.uRoot, uMid: envU.uMid, uTip: envU.uTip, uSunCol2: envU.uSunCol, uSheenK: envU.uSheenK, uSunDir2: envU.uSunDir });

    .replace('#include <common>', '#include <common>\nvarying vec3 vWP; varying vec3 vWN;')
    .replace('#include <beginnormal_vertex>', '#include <beginnormal_vertex>\nvWN = objectNormal;')
    .replace('#include <project_vertex>', '#include <project_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');

    .replace('#include <common>', `#include <common>
varying vec3 vWP; varying vec3 vWN;
uniform vec3 uRoot, uMid, uTip, uSunCol2, uSunDir2; uniform float uSheenK;
${GLSL_NOISE}
${GLSL_WIND}
vec4 gW;`)
    .replace('#include <color_fragment>', `#include <color_fragment>
{
  vec2 p = vWP.xz;
  float n1 = vnoise(p * 0.018) * 0.6 + vnoise(p * 0.05) * 0.4;
  float n2 = vnoise(p * 0.22);
  float st = vnoise(vec2(p.x * 1.7 + p.y * 0.4, p.y * 0.35 - p.x * 0.2)) * 0.6 + vnoise(p * vec2(4.1, 1.1)) * 0.4;
  float n3 = vnoise(p * 0.009 + 7.0);

  col = mix(col, uTip, smoothstep(0.45, 0.95, n2 * 0.6 + st * 0.5) * 0.45);
  col = mix(col, col * vec3(1.05, 0.82, 0.62), smoothstep(0.55, 0.85, n3) * 0.45);
  col = mix(col, vec3(0.30, 0.33, 0.12), smoothstep(0.66, 0.86, vnoise(p * 0.013 + 3.0)) * 0.14);

scene.add(terrain);
const outer = buildTerrain(2400, 120, Hout, terrainMat);
outer.receiveShadow = false;

// ================================================================ grass (instanced clumps, GPU wind)
function clumpGeometry() {
  const pos = [], nor = [], at = [], kind = [], idx = [];
  let base = 0;
  function ribbon(ox, oz, yaw, h, w, lean, segs, k, curl) {
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    for (let s = 0; s <= segs; s++) {
      const t = s / segs;
      const ww = w * (1 - Math.pow(t, 1.4)) * (k === 2 ? 1 : 1);
      const y = h * t * (1 - 0.12 * lean * t);
      const off = lean * h * t * t * 0.45;
      for (const side of (s === segs ? [0] : [-1, 1])) {
        const lx = side * ww * 0.5, lz = off;
        const x = ox + cy * lx - sy * lz, z = oz + sy * lx + cy * lz;
        pos.push(x, y, z);
        const nz = 1, nx = side * 0.35 * curl;
        nor.push(cy * nx - sy * nz, 0.35 + lean * 0.4 * t, sy * nx + cy * nz);
        at.push(t); kind.push(k);
      }
    }
    for (let s = 0; s < segs - 1; s++) {
      const a = base + s * 2;
      idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
    const a = base + (segs - 1) * 2;
    idx.push(a, a + 1, a + 2);
    base += segs * 2 + 1;
  }
  function head(ox, oz, h, len, w, yaw) {
    for (let q = 0; q < 2; q++) {
      const yy = yaw + q * Math.PI / 2, cy = Math.cos(yy), sy = Math.sin(yy);
      const pts = [[0, h - 0.02, 0.0], [-w, h + len * 0.42, 0.0], [w, h + len * 0.42, 0.0], [0, h + len, 0.0]];
      const ts = [0.86, 0.95, 0.95, 1.0];
      for (let i = 0; i < 4; i++) {
        const [lx, y] = pts[i];

      for (let s = 1; s <= 5; s++) steps.push({ dt: 0.03, f: () => synth('move', AT.sx + s * 22, AT.sy + s * 14, 1) });
      steps.push({ dt: 0.03, f: () => synth('up', 0, 0, 1) });
      atQueue(steps);
    } else {
      // slightly outside the blade tips: rescued by the proximity zone
      atQueue([{ dt: 0.1, f: () => { const p = bladePoint(m, 1.18, 0.5); synth('down', p.x, p.y, 1); } }, { dt: 0.1, f: () => synth('up', 0, 0, 1) }]);
    }
  } else if (G.state === 'SPIN' && G.tState > 2.0 && !AT.did['s' + k] && k % 2 === 0) {
    AT.did['s' + k] = true;
    atQueue([{ dt: 0.05, f: () => { const p = bladePoint(m, 0.5); synth('down', p.x, p.y, 1); } }, { dt: 0.1, f: () => synth('up', 0, 0, 1) },
      { dt: 0.12, f: () => { const p = bladePoint(m, 0.5); synth('down', p.x, p.y, 1); } }, { dt: 0.08, f: () => synth('up', 0, 0, 1) }]);
  } else if (G.state === 'FREE_WAIT' && G.centered && G.waitT > 1.0) {
    if (G.freeMoves >= 2) { G.flags.finished = true; AT.done = true; return; }
    const key = 'f' + G.freeMoves;
    if (AT.did[key]) return;
    AT.did[key] = true;
    atQueue([{ dt: 0.1, f: () => { const p = bladePoint(m, 0.6); synth('down', p.x, p.y, 1); } }, { dt: 0.1, f: () => synth('up', 0, 0, 1) }]);
  }
}

// ================================================================ main loop
window.__test = { state: 'PREP' };
if (URLP.has('dbg')) window.__dbg = { waves, windU, mills, G, terrainMat, grassNear, groupPose, focusPose, H, Hout };
let last = performance.now(), frames = 0, ready = false, prevT = 0;
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  const dtReal = Math.min(1, (now - last) / 1000);
  last = now;
  const dt = Math.min(dtReal, AUTOTEST ? 0.34 : 0.1);
  try {
    G.t += dt;
    windU.uTime.value = G.t;
    runSched();
    if (AUTOTEST) autotest();
    updateGame(dt);
    computeDesired();
    const k = 1 - Math.exp(-dt * 3.2);
    camPos.lerp(desPos, k); camLook.lerp(desLook, k);
    camera.position.copy(camPos); camera.lookAt(camLook);
    camera.updateMatrixWorld();
    sky.position.copy(camera.position);
    updateLook(dt);
    updateMills(dt);
    const act = updateWaves();
    const ns = updateSeeds(dt);
    updateGrassLayers();
    updateAudio(dt);
    if (composer) composer.render(dt); else renderer.render(scene, camera);
    frames++;
    if (frames > 2) qualityTick(dtReal);
    if (!ready && frames >= 2) {
      ready = true;
      window.__ready = true;
      const ld = document.getElementById('ld'); if (ld) { ld.style.opacity = '0'; setTimeout(() => ld.remove(), 1200); }
    }
    const avg = a => a.length ? Math.round(a.reduce((s, v) => s + v, 0) / a.length * 10) / 10 : 0;
    const T = window.__test;
    T.state = G.state; T.target = G.target; T.spun = G.spun; T.stage = G.stage; T.climax = G.flags.climax; T.climaxT = Math.round(G.cT * 10) / 10;
    T.peak = G.flags.peak; T.free = G.flags.free; T.freeMoves = G.freeMoves; T.finished = G.flags.finished; T.frames = frames;
    T.fps = Math.round(QM.fps * 10) / 10; T.q = QN; T.waves = act; T.seeds = ns; T.t = Math.round(G.t * 10) / 10;
    T.centered = G.centered; T.flags = G.flags;
    if (frames % 30 === 0) { T.fpsNormal = avg(QM.fpsN); T.fpsClimax = avg(QM.fpsC); }
  } catch (e) {
    window.__errors.push('frame: ' + String(e && e.message || e));
  }
}
// initial pose
applyQuality(QN);
{ // test helper: ?jump=N starts with N windmills already turning
  const J = clamp(parseInt(URLP.get('jump') || '0', 10) || 0, 0, MILLS - 1);
  for (let k = 0; k < J; k++) { const m = mills[k]; m.spun = true; m.omega = m.omegaT = 1.7; G.spun++; }
  G.target = J; G.stage = Math.min(2, Math.floor(J / 5)); G.cam.a = J;
  G.P = G.Pt = clamp((G.spun - 1) / 6.5, 0, 2);
}
refreshEnv(0);
computeDesired();
camPos.copy(desPos); camLook.copy(desLook);
camera.position.copy(camPos); camera.lookAt(camLook);
for (const m of mills) m.angle = 0;
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { last = performance.now(); if (AU.ctx && document.visibilityState === 'visible' && AU.ctx.state !== 'running') AU.ctx.resume().catch(() => {}); });
</script>
<script src="../../gf-playlog.js" defer></script>
