// ===========================================================================

function canvasTex(size, draw, color) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const t = new THREE.CanvasTexture(c);

  t.anisotropy = 4;
  return t;
}
// polishing scratches (roughness)
const brassRough = canvasTex(512, (g, s) => {
  g.fillStyle = 'rgb(214,214,214)'; g.fillRect(0, 0, s, s);
  const img = g.getImageData(0, 0, s, s); const d = img.data;
  for (let i = 0; i < d.length; i += 4) { const v = 200 + rnd() * 34; d[i] = d[i + 1] = d[i + 2] = v; }
  g.putImageData(img, 0, 0);
  for (let i = 0; i < 900; i++) {
    const x = rnd() * s, y = rnd() * s, len = 20 + rnd() * 160, ang = (rnd() - 0.5) * 0.35;
    const v = rnd() < 0.5 ? 150 : 255;
    g.strokeStyle = `rgba(${v},${v},${v},${0.05 + rnd() * 0.12})`; g.lineWidth = 0.5 + rnd() * 1.1;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len); g.stroke();
  }
  for (let i = 0; i < 70; i++) {

    gr.addColorStop(0, 'rgba(255,255,255,0.12)'); gr.addColorStop(1, 'rgba(255,255,255,0)');

  }
}, false);

// subtle tone variation and aged spots (color)
const brassColor = canvasTex(256, (g, s) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 160; i++) {
    const x = rnd() * s, y = rnd() * s, r = 4 + rnd() * 26;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const dark = rnd() < 0.6;
    gr.addColorStop(0, dark ? 'rgba(120,96,60,0.16)' : 'rgba(255,240,210,0.2)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}, true);
brassColor.repeat.set(2, 1);
const stoneTex = canvasTex(256, (g, s) => {
  const img = g.createImageData(s, s); const d = img.data;

  g.putImageData(img, 0, 0);

    gr.addColorStop(0, rnd() < 0.5 ? 'rgba(150,140,120,0.15)' : 'rgba(255,250,240,0.15)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}, true);
const glowTex = canvasTex(128, (g, s) => {
  const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, 'rgba(255,255,255,0.55)');

// ===========================================================================
// lantern light injected into stone, plants and water (24 lights, cheap, no shadows)
// ===========================================================================
const NL = 24;
const lampU = {
  uLP: { value: Array.from({ length: NL }, () => new THREE.Vector4(0, -50, 0, 0)) },
  uLC: { value: Array.from({ length: NL }, () => new THREE.Vector3()) },
  uLampGain: { value: 1.3 },
  uTime: { value: 0 }
};
const LAMP_GLSL = `
uniform vec4 uLP[${NL}]; uniform vec3 uLC[${NL}]; uniform float uLampGain;
vec3 lampLight(vec3 p, vec3 n){
  vec3 s = vec3(0.0);
  for (int i = 0; i < ${NL}; i++) {
    vec4 lp = uLP[i];
    if (lp.w <= 0.0) continue;
    vec3 L = lp.xyz - p; float d2 = dot(L, L) + 0.05;
    float nd = max(dot(n, L * inversesqrt(d2)), 0.0) * 0.72 + 0.28;
    s += uLC[i] * (lp.w * nd / (1.0 + d2 * 1.3));
  }
  return s * uLampGain;
}`;
const PAVE_GLSL = `
float ph(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float pvn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(ph(i), ph(i+vec2(1.0,0.0)), f.x), mix(ph(i+vec2(0.0,1.0)), ph(i+vec2(1.0,1.0)), f.x), f.y); }
vec4 paving(vec3 p){
  float r = length(p.xz); float a = atan(p.z, p.x);
  float inner = step(r, 3.62);
  float bw = mix(0.62, 0.44, inner);
  float rr = r / bw; float ri = floor(rr); float fr = fract(rr);
  float circ = 6.2831 * max(r, 0.3);
  float n = max(5.0, floor(circ / mix(0.78, 0.5, inner)));
  float s = (a / 6.2831 + 0.5) * n + ph(vec2(ri, 3.1)) * n; float si = floor(s); float fs = fract(s);
  float m = min(min(fr, 1.0 - fr) * bw, min(fs, 1.0 - fs) * circ / n);
  float joint = smoothstep(0.006, 0.022, m);
  float h = ph(vec2(ri, si)); float h2 = ph(vec2(si + 3.7, ri + 7.0));
  vec3 tint = mix(vec3(1.0, 0.97, 0.92), vec3(0.92, 0.9, 0.87), h) * (0.86 + 0.2 * h2);
  float grain = pvn(p.xz * 23.0) * 0.5 + pvn(p.xz * 61.0) * 0.5;
  tint *= 0.9 + 0.16 * grain;
  tint *= mix(0.5, 1.0, joint) * mix(0.92, 1.0, smoothstep(0.022, 0.07, m));

function patchLamp(mat, opt) {
  const paving = !!(opt && opt.paving); const sway = (opt && opt.sway) || 0;

    sh.uniforms.uLP = lampU.uLP; sh.uniforms.uLC = lampU.uLC; sh.uniforms.uLampGain = lampU.uLampGain; sh.uniforms.uTime = lampU.uTime;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vPw; varying vec3 vNw; uniform float uTime;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
      ${sway ? `{ vec3 ip = vec3(0.0);
      #ifdef USE_INSTANCING
        ip = instanceMatrix[3].xyz;
      #endif
        float sw = (sin(uTime * 1.6 + ip.x * 1.7 + ip.z * 1.3) + 0.5 * sin(uTime * 2.7 + ip.z * 2.1 + ip.x)) * ${sway.toFixed(3)} * max(transformed.y + 0.02, 0.0);

      .replace('#include <common>', '#include <common>\nvarying vec3 vPw; varying vec3 vNw;\n' + LAMP_GLSL + (paving ? PAVE_GLSL : ''));

        .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\nroughnessFactor = pv.a;');

// ring materials with a light that runs along the ring
function ringMat() {
  const U = { uFlowA: { value: 0 }, uFlowR: { value: 0 }, uFlowAmt: { value: 0 }, uGlow: { value: 0 } };
  const m = brassMat();
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vLoc;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvLoc = transformed;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vLoc; uniform float uFlowA, uFlowR, uFlowAmt, uGlow;')
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      { float aa = atan(vLoc.x, vLoc.z); float da = abs(mod(aa - uFlowA + 3.14159265, 6.2831853) - 3.14159265);

function merge(list) {

    const x = g.index ? g.toNonIndexed() : g;
    for (const k of Object.keys(x.attributes)) if (!['position', 'normal', 'uv'].includes(k)) x.deleteAttribute(k);
    if (!x.attributes.uv) x.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(x.attributes.position.count * 2), 2));
    return x;

}

const tor = (r, t, rs = 8, ts = 32, arc = TAU) => new THREE.TorusGeometry(r, t, rs, ts, arc);

function rod(a, b, r, seg = 8) {
  const d = new THREE.Vector3().subVectors(b, a); const len = d.length();
  const g = cyl(r, r, len, seg);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(V3(0, 1, 0), d.normalize()));

function gearGeo(R, teeth, depth, hole, windows) {
  const s = new THREE.Shape(); const td = Math.min(0.055, R * 0.13); const rr = R - td; const w = TAU / teeth;
  for (let i = 0; i < teeth; i++) {
    const a0 = i * w;
    const pts = [[rr, a0], [rr, a0 + w * 0.12], [R, a0 + w * 0.3], [R, a0 + w * 0.55], [rr, a0 + w * 0.73]];
    pts.forEach(([r, a], j) => { const x = Math.cos(a) * r, y = Math.sin(a) * r; if (i === 0 && j === 0) s.moveTo(x, y); else s.lineTo(x, y); });
  }
  s.closePath();
  const hp = new THREE.Path(); hp.absarc(0, 0, hole, 0, TAU, true); s.holes.push(hp);
  if (windows) {
    for (let k = 0; k < windows; k++) {
      const a = k / windows * TAU; const cr = (rr + hole) * 0.5; const wr = (rr - hole) * 0.28;
      const p = new THREE.Path(); p.absarc(Math.cos(a) * cr, Math.sin(a) * cr, wr, 0, TAU, true); s.holes.push(p);
    }

      cur.ret = null;
      const n = camera.getWorldDirection(new THREE.Vector3()).negate();
      const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(n, cur.g.position);
      raycaster.setFromCamera(ndc.set(x / W * 2 - 1, -(y / H) * 2 + 1), camera);
      const hit = raycaster.ray.intersectPlane(plane, new THREE.Vector3()) || cur.g.position.clone();
      drag = { id: e.pointerId, x, y, lx: x, lt: performance.now(), vx: 0, plane, off: cur.g.position.clone().sub(hit), want: cur.g.position.clone(), lift: 0 };
      setState('DRAGGING'); sGlass(); idleT = 0;

      return;
    }
  }
  if (state === 'FREE_PLAY') {
    // dial
    const dsP = toScreen(dialDisc.getWorldPosition(new THREE.Vector3()));
    if (freeShown > 0.5 && Math.hypot(x - dsP.x, y - dsP.y) < Math.max(46, scr * 0.065)) {
      activePointer = e.pointerId; try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }

    }
    // handle
    const hk = toScreen(handleKnob.localToWorld(V3(0.3, 0.3, 0)));
    if (Math.hypot(x - hk.x, y - hk.y) < Math.max(46, scr * 0.065)) {

    }

    let best = null, bd = Math.max(40, scr * 0.055);

    if (best) { best.boost = Math.max(best.boost, 1.1); bell(PENTA[best.n] * (best.ring >= 2 ? 2 : 1), 0.08, 1.6); const p = best.g.localToWorld(V3(0, -0.34, 0)); for (let i = 0; i < 10; i++) emit(p, V3((rnd() - 0.5) * 0.8, rnd() * 0.6, (rnd() - 0.5) * 0.8), 0.9, C('#FFE0A0').lerp(best.tint, 0.4), 0.05, -0.4); }

function onMove(e) {

    const hit = raycaster.ray.intersectPlane(drag.plane, new THREE.Vector3());

function cancelAll() { activePointer = null; dialHold = null; endDrag(false); }
canvas.addEventListener('pointerdown', onDown, { passive: false });

window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
window.addEventListener('blur', cancelAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAll(); });
window.addEventListener('orientationchange', cancelAll);
for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu', 'selectstart', 'dragstart']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
function onResize() {
  W = innerWidth; H = innerHeight;
  if (drag) cancelAll();
  renderer.setSize(W, H); if (composer) composer.setSize(W, H);
  pMat.uniforms.uScale.value = H * renderer.getPixelRatio() / (2 * Math.tan(camGoal.fov * Math.PI / 360));
  setFraming(false);
}
window.addEventListener('resize', onResize);

// ===========================================================================
// autotest: real pointer events through the same paths as touch play
// ===========================================================================
const AT = { phase: 'wait', t: 0, p0: null, dest: null, free: 0 };
function fire(type, x, y) {
  if (!Number.isFinite(x) || !Number.isFinite(y)) return;
  canvas.dispatchEvent(new PointerEvent(type, { pointerId: 7, clientX: x, clientY: y, bubbles: true, cancelable: true, pointerType: 'touch', isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1 }));
}
function autotest(dt) {
  if (state === 'IDLE' && cur && cur.appear >= 1 && !cur.ret && AT.phase === 'wait') {
    AT.t += dt;
    if (AT.t > 0.5) {
      const bs = bodyScreen(cur), os = toScreen(cur.g.position);
      const hs = toScreen(targetHookWorld(new THREE.Vector3()));
      AT.p0 = bs; AT.dest = { x: hs.x + (bs.x - os.x), y: hs.y + (bs.y - os.y) };

    const x = lerp(AT.p0.x, AT.dest.x, f), y = lerp(AT.p0.y, AT.dest.y, f);
    fire('pointermove', x, y);

  } else if (AT.phase === 'hold') {

    AT.phase = 'wait'; AT.t = 0;
  } else if (state === 'FREE_PLAY') {
    AT.free += dt;
    if (AT.free > 1.5 && !AT.h) { AT.h = true; const hk = toScreen(handleKnob.localToWorld(V3(0.3, 0.3, 0))); fire('pointerdown', hk.x, hk.y); fire('pointerup', hk.x, hk.y); }
    if (AT.free > 3.0 && !AT.l) { AT.l = true; const s = bodyScreen(lanterns[2]); fire('pointerdown', s.x, s.y); fire('pointerup', s.x, s.y); window.__game.freeplay = true; }
  }
}
window.__dbg = () => ({ crownA, speedMul, thetas: ringObjs.map((r) => r.theta), spins: ringObjs.map((r) => r.spin), hk: handleKnob.localToWorld(V3(0.3, 0.3, 0)), l2: lanterns[2].g.position, sv: sunOrn.userData.v, cam: camera.position });
window.__game = {
  get state() { return state; }, get count() { return count; }, get stage() { return Math.min(3, Math.floor(count / 6)); },
  get q() { return qName; }, get finaleT() { return fin ? fin.t : 0; }, climax: false, freeplay: false,
  screen() { const out = {}; if (cur) out.lantern = bodyScreen(cur); if (count < 24) out.hook = toScreen(targetHookWorld(new THREE.Vector3())); out.axisTop = toScreen(V3(0, SUN_Y + 0.92, 0)); out.axisBottom = toScreen(V3(0, 0.3, 0)); out.ringL = toScreen(V3(-3.2, 1.6, 0)); out.ringR = toScreen(V3(3.2, 1.6, 0)); out.W = W; out.H = H; return out; }
};

// ===========================================================================
// main loop
// ===========================================================================
applyQuality(qName);
setFraming(true);
updateCamera(0);
spawnNext();
let last = performance.now(), frames = 0;
function frame(now) {
  requestAnimationFrame(frame);
  try {
    const raw = Math.max(0, (now - last) / 1000); last = now;
    const dt = Math.min(MAXDT, raw);
    clock += dt; lampU.uTime.value = clock;
    updateCamera(dt);
    updateGame(dt);
    const drive = updateDevice(dt);
    scene.updateMatrixWorld();
    const total = updateLanterns(dt);
    updateSky(dt, total);
    updateParticles(dt);
    updateAudio(dt, drive);
    if (AUTOTEST) autotest(dt);
    if (state === 'FINALE') window.__game.climax = true;
    if (useComposer) composer.render(dt); else renderer.render(scene, camera);
    monitorQuality(raw);
    frames++;
    if (frames === 2) window.__ready = true;
  } catch (e) { ERR('frame: ' + (e && e.message)); }
}
requestAnimationFrame(frame);
} catch (e) {
  ERR('init: ' + (e && e.stack || e));
}
