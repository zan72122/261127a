[[-30, 64, 7, 38], [92, 62, 8, 34], [-118, 62, 7, 34], [-112, -84, 11, 40], [52, -86, 10, 38], [-20, -70, 6, 30],

// height texture for GPU grass

const heightData = new Float32Array(HN * HN);

      m.boostT = Math.max(0, m.boostT - dt);
      const goal = m.dir * BASE_OMEGA * (speedMul + (m.boostT > 0 ? 0.75 * Math.min(1, m.boostT / 1.5) : 0));
      m.omega += (goal - m.omega) * (1 - Math.exp(-dt / 1.4));
      m.angle += m.omega * dt;
      // periodic small waves so the meadow keeps moving
      if (time > m.nextEmit && state !== 'CLIMAX') {
        m.nextEmit = time + 7 + prng() * 4.5;
        const P = STP[free ? 2 : stageOf(target)];
        emitWave(m.base.x, m.base.z, 15 * D2R, P.speed, P.width * 0.8, 75 + P.range * 0.15, 0, { silent: true });
      }
      m.rotor.rotation.z = m.angle;
    } else {
      // waiting windmill: a faint sway as if waiting for the wind, stronger after a long pause
      let wig = 0.5 * D2R * Math.sin(time * 0.9 + m.i);
      if (m === tgt && state === 'WAIT' && idleT > 6) wig += 3 * D2R * Math.sin(time * 1.6) * smooth(6, 7.5, idleT);
      m.rotor.rotation.z = m.angle + wig;
    }
  }
  // hint glow on the blade to touch
  const waiting = state === 'WAIT';
  const goalH = waiting ? (idleT > 3 ? 1.0 : 0.38) : 0;
  HINT.uHint.value += (goalH - HINT.uHint.value) * Math.min(1, dt * 3);
  const cyc = idleT > 3 ? 1.6 : 2.4;
  HINT.uHintPh.value = ((time % cyc) / cyc) * 1.35 - 0.15;
}

// ================================================================ day / light
const tmpC = new THREE.Color(), tmpC2 = new THREE.Color();
function updateDay(dt) {
  const goal = free || state === 'CLIMAX' || state === 'AFTER' ? 2 : Math.min(2, done / 7.5);
  day += (goal - day) * Math.min(1, dt * 0.35);
  const d = day;
  const el = (d < 1 ? lerp(SUN_EL[0], SUN_EL[1], d) : lerp(SUN_EL[1], SUN_EL[2], d - 1)) * D2R;
  GU.uSunDir.value.set(Math.cos(el) * Math.cos(SUN_AZ), Math.sin(el), Math.cos(el) * Math.sin(SUN_AZ)).normalize();
  palInto(tmpC, 'sun', d);
  const sunI = lerp(2.9, 2.6, d / 2);
  sun.color.copy(tmpC); sun.intensity = sunI;
  GU.uSunCol.value.copy(tmpC).multiplyScalar(sunI / Math.PI);
  palInto(SKYU.uTop.value, 'skyTop', d);
  palInto(SKYU.uHor.value, 'horizon', d);
  SKYU.uSunC.value.copy(tmpC);
  hemi.color.set(0xd5e9ff).lerp(SKYU.uHor.value, 0.15);
  hemi.groundColor.set(0xb89a60);
  hemi.intensity = 1.45;
  GU.uSky.value.copy(hemi.color).multiplyScalar(hemi.intensity / Math.PI);
  GU.uGnd.value.copy(hemi.groundColor).multiplyScalar(hemi.intensity / Math.PI);
  palInto(GU.uGRoot.value, 'gRoot', d);
  palInto(GU.uGMid.value, 'gMid', d);
  palInto(GU.uGTip.value, 'gTip', d);
  palInto(GU.uFarHill.value, 'farHill', d).multiplyScalar(0.78);
  palInto(tmpC2, 'blade', d); bladeMat.color.copy(tmpC2); hintMat.color.copy(tmpC2);
  scene.fog.color.copy(SKYU.uHor.value).lerp(tmpC.copy(GU.uFarHill.value).multiplyScalar(1.2), 0.62);
  GU.uFogCol.value.copy(scene.fog.color);
  const wide = state === 'CLIMAX' || state === 'AFTER' || (state === 'MOVE' && free && freeMoves === 0) ? 1 : 0;
  fogWide += (wide - fogWide) * Math.min(1, dt * 0.6);
  const Ld = camera.position.distanceTo(cam.look);
  scene.fog.near = Math.max(140, Ld * 0.85); scene.fog.far = Math.max(650, Ld + 900);
  GU.uFog.value.set(scene.fog.near, scene.fog.far);
  GU.uAer.value.set(Math.max(150, Ld * 0.8), Math.max(520, Ld + 420), 0.55);
  GU.uGlowK.value = 1.0 + 0.38 * glowBoost + 0.1 * d;
  WU.uAmb.value.z = lerp(0.045, 0.07, d / 2) + 0.05 * glowBoost;
  WU.uAmb.value.w = lerp(0.05, 0.08, d / 2) + 0.06 * glowBoost;
  refreshEnv(d);
}
let fogWide = 0;

// ================================================================ post (bloom) + quality
let composer = null, bloom = null;
function setupComposer() {
  const w = window.innerWidth, h = window.innerHeight;
  const rt = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, samples: qName === 'high' ? 4 : 2 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(w, h), 0.3, 0.35, 0.95);
  const bs = bloom.setSize.bind(bloom);
  bloom.setSize = (W, H) => { const k = QS[qName].bloom === 1 ? 0.5 : 1; bs(Math.max(2, Math.floor(W * k)), Math.max(2, Math.floor(H * k))); };
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
}
setupComposer();
function applyQuality(name) {
  qName = name; qIdx = QN.indexOf(name);
  const Q = QS[name];
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.pr));
  onResize();
  nearGeo.instanceCount = Q.near; farGeo.instanceCount = Q.far;
  if (sun.shadow.mapSize.x !== Q.shadow) {
    sun.shadow.mapSize.set(Q.shadow, Q.shadow);
    if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  }
  SKYU.uOct.value = Q.oct;
  seedCap = Q.seeds;
}
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); }
  seedMat.uniforms.uPx.value = h * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * D2R / 2));
  camRefit();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

let fpsT = 0, fpsN = 0, fpsNow = 60, warm = 3.5, lowRun = 0, highRun = 0, qCool = 0, qUps = 0, qDowns = 0;
function qualityMonitor(rawDt) {
  fpsT += rawDt; fpsN++;
  if (warm > 0) { warm -= rawDt; if (warm <= 0) { fpsT = 0; fpsN = 0; } return; }
  qCool -= rawDt;
  if (fpsT < 1) return;
  fpsNow = fpsN / fpsT; fpsT = 0; fpsN = 0;
  if (QF || AUTOTEST || qCool > 0) return;
  if (fpsNow < 48) { lowRun++; highRun = 0; } else if (fpsNow > 57) { highRun++; lowRun = 0; } else { lowRun = 0; highRun = 0; }
  if (lowRun >= 3 && qIdx > 0) { applyQuality(QN[qIdx - 1]); lowRun = 0; qCool = 8; qDowns++; }
  else if (highRun >= 15 && qIdx < 2 && qUps < 1 + (qDowns ? 0 : 1) && state !== 'CLIMAX') { applyQuality(QN[qIdx + 1]); highRun = 0; qCool = qDowns ? 40 : 20; qUps++; }
}

// ================================================================ input
let activeId = null, pressMill = null, lastPX = 0, lastPY = 0, lastPT = 0, swipeW = 0;
function screenOf(v) { _v3.copy(v).project(camera); return { x: (_v3.x * 0.5 + 0.5) * window.innerWidth, y: (-_v3.y * 0.5 + 0.5) * window.innerHeight, z: _v3.z }; }
function pickMill(cx, cy) {
  let best = null;
  for (const m of mills) {
    const s = screenOf(m.hub); if (s.z > 1 || s.z < -1) continue;
    const top = screenOf(_v2.copy(m.hub).add(_v1.set(0, m.R, 0)));
    const rs = Math.hypot(top.x - s.x, top.y - s.y);
    const reach = Math.max(rs * 1.3, 40);
    const d = Math.hypot(cx - s.x, cy - s.y);
    if (d > reach) continue;
    let sc = d / reach - (m.i === target ? 1 : 0) - (m.spun ? 0.2 : 0);
    if (!m.spun && m.i !== target) continue;
    if (!best || sc < best.sc) best = { m, sc, s };
  }
  return best;
}
function groundHit(cx, cy) {
  const ndc = new THREE.Vector2(cx / window.innerWidth * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
  const rc = new THREE.Raycaster(); rc.setFromCamera(ndc, camera);
  const o = rc.ray.origin, d = rc.ray.direction;
  let t = 1, prev = o.y - groundAt(o.x, o.z);
  for (let k = 0; k < 160; k++) {
    const p = _v1.copy(o).addScaledVector(d, t);
    const h = p.y - groundAt(p.x, p.z);
    if (h < 0 && prev >= 0) return p.clone();
    prev = h; t += Math.max(0.8, t * 0.03);
    if (t > 700) break;
  }
  return null;
}
function onDown(e) {
  initAudio();
  if (activeId !== null) return;
  if (state === 'LOADING') return;
  activeId = e.pointerId;
  try { if (e.target && e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId); } catch (x) {}
  lastPX = e.clientX; lastPY = e.clientY; lastPT = performance.now(); swipeW = 0;
  const hit = pickMill(e.clientX, e.clientY);
  if (hit) {
    pressMill = hit.m;
    onTouchMill(hit.m, 0);
  } else {
    pressMill = null;
    idleT = Math.min(idleT, 2);
    const p = groundHit(e.clientX, e.clientY);
    if (p) { emitWave(p.x, p.z, 12 * D2R, 13, 5, 26, 0, { silent: true }); sWhoosh(1.2, 0.03, 1600, 3800); seedBurst(p.x, p.z, 4, 4, 0.8); }
  }
}
function onMove(e) {
  if (e.pointerId !== activeId || !pressMill) return;
  const now = performance.now(), dtm = Math.max(1, now - lastPT) / 1000;
  const s = screenOf(pressMill.hub);
  const rx = e.clientX - s.x, ry = e.clientY - s.y;
  const vx = (e.clientX - lastPX) / dtm, vy = (e.clientY - lastPY) / dtm;
  const r2 = Math.max(400, rx * rx + ry * ry);
  // screen y is down, so negate for a counter-clockwise positive angle
  const w = -(rx * vy - ry * vx) / r2;
  swipeW = lerp(swipeW, w, 0.5);
  lastPX = e.clientX; lastPY = e.clientY; lastPT = now;
  const m = pressMill;
  if (m.spun && Math.abs(swipeW) > 0.4) {
    m.dir = Math.sign(swipeW);
    const want = clamp(Math.abs(swipeW) * 0.55, 0.6, 3.2);
    if (Math.abs(m.omega) < want || Math.sign(m.omega) !== m.dir) m.omega = m.dir * want;
    m.boostT = Math.max(m.boostT, clamp(Math.abs(swipeW) * 0.4, 0.8, 2.5));
  }
}
function onUp(e) {
  if (e.pointerId !== activeId) return;
  activeId = null; pressMill = null;
}
canvas.addEventListener('pointerdown', e => { e.preventDefault(); onDown(e); }, { passive: false });
canvas.addEventListener('pointermove', e => { onMove(e); });
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
canvas.addEventListener('lostpointercapture', onUp);
window.addEventListener('blur', () => { activeId = null; pressMill = null; });
for (const ev of ['contextmenu', 'dblclick', 'gesturestart', 'gesturechange', 'selectstart', 'dragstart']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend().catch(() => {}); else AC.resume().catch(() => {});
  activeId = null; pressMill = null;
});

// ================================================================ autotest (drives the same input handlers)
const atQ = [];
let atStep = -1, atBg = false, atRetouch = -1;
function atPush(dt, kind, x, y) { atQ.push({ t: time + dt, kind, x, y }); }
function atTapMill(m, swipe) {
  const s = screenOf(m.hub);
  const top = screenOf(_v2.copy(m.hub).add(_v1.set(0, m.R, 0)));
  const rs = Math.hypot(top.x - s.x, top.y - s.y);
  const a = -30 * D2R;
  const px = s.x + Math.cos(a) * rs * 0.6, py = s.y - Math.sin(a) * rs * 0.6;
  atPush(0, 'down', px, py);
  if (swipe) {
    for (let k = 1; k <= 6; k++) { const b = a - k * 0.12; atPush(k * 0.03, 'move', s.x + Math.cos(b) * rs * 0.6, s.y - Math.sin(b) * rs * 0.6); }
    atPush(0.22, 'up', 0, 0);
  } else atPush(0.08, 'up', 0, 0);
}
function autotest() {
  while (atQ.length && atQ[0].t <= time) {
    const a = atQ.shift();
    const ev = { pointerId: 7, clientX: a.x, clientY: a.y, target: null, preventDefault() {} };
    if (a.kind === 'down') { lastAtX = a.x; lastAtY = a.y; onDown(ev); }
    else if (a.kind === 'move') onMove(ev);
    else onUp(Object.assign(ev, { clientX: lastAtX, clientY: lastAtY }));
  }
  if (atQ.length) return;
  if (state === 'WAIT') {
    if (target === 2 && !atBg && stateT > 0.6) { atBg = true; atPush(0, 'down', window.innerWidth * 0.12, window.innerHeight * 0.9); atPush(0.1, 'up', 0, 0); return; }
    if (stateT > 1.4) atTapMill(mills[target], target % 2 === 1);
  } else if (state === 'WAVE' && !free && stateT > 1.2 && target % 3 === 1 && atRetouch !== target) {
    atRetouch = target; atTapMill(mills[target], false);
  }
}
let lastAtX = 0, lastAtY = 0;

// ================================================================ main loop
let last = performance.now() / 1000, frames = 0, shadowFocus = new THREE.Vector3();
const grassCenter = new THREE.Vector2(0, 120);
function updateAudio() {
  if (!AC || !rotG) return;
  const t = AC.currentTime;
  const m = mills[target];
  let om = 0, ang = 0;
  if (m && m.spun) { om = Math.abs(m.omega); ang = m.angle; }
  const spinning = mills.filter(o => o.spun).length;
  const pass = Math.pow(0.5 + 0.5 * Math.cos(3 * ang), 3);
  const near = state === 'CLIMAX' || state === 'AFTER' ? 0.4 : 1;
  rotG.gain.setTargetAtTime(near * clamp(om / BASE_OMEGA, 0, 2) * (0.012 + 0.05 * pass), t, 0.03);
  rotF.frequency.setTargetAtTime(380 + om * 260, t, 0.1);
  const gust = 0.5 + 0.5 * Math.sin(time * 0.37) * Math.sin(time * 0.23 + 1);
  ambG.gain.setTargetAtTime(0.045 + 0.035 * gust + 0.004 * spinning + 0.05 * glowBoost, t, 0.5);
  ambF.frequency.setTargetAtTime(420 + 260 * gust + 500 * glowBoost, t, 0.5);
  padG.gain.setTargetAtTime(0.004 + 0.0012 * spinning + 0.012 * glowBoost, t, 1.2);
}
function frame() {
  requestAnimationFrame(frame);
  const nowS = performance.now() / 1000;
  const raw = nowS - last; last = nowS;
  const dt = clamp(raw, 0, AUTOTEST ? 0.6 : 0.25);
  time += dt;
  WU.uTime.value = time;
  frames++;
  try {
    for (let i = pendings.length - 1; i >= 0; i--) if (pendings[i].t <= time) { const p = pendings[i]; pendings.splice(i, 1); p.fn(); }
    if (AUTOTEST) autotest();
    updateState(dt);
    updateMills(dt);
    updateDay(dt);
    uploadWaves();
    updateCamera(dt);
    // grass follows the area in front of the camera
    const tl = cam.look;
    const gk = lerp(0.28, 0.42, fogWide);
    const gx = lerp(tl.x, camera.position.x, gk), gz = lerp(tl.z, camera.position.z, gk);
    grassCenter.set(gx, gz);
    grassNear.material.uniforms.uCenter.value.copy(grassCenter);
    grassFar.material.uniforms.uCenter.value.copy(grassCenter);
    // climax: grass layers spread wider
    const wide = fogWide;
    grassNear.material.uniforms.uFade.value.set(-2, -1, lerp(44, 56, wide), lerp(56, 62, wide));
    grassFar.material.uniforms.uFade.value.set(lerp(44, 54, wide), lerp(56, 62, wide), lerp(172, 300, wide), lerp(206, 335, wide));
    grassFar.material.uniforms.uTS.value = lerp(1, 1.65, wide);
    grassFar.material.uniforms.uHMul.value = lerp(1.7, 2.8, wide);
    // shadow box around the focus
    shadowFocus.lerp(_v1.set(tl.x, groundAt(tl.x, tl.z), tl.z), Math.min(1, dt * 2));
    const ext = lerp(80, 260, fogWide);
    if (Math.abs(SC.right - ext) > 1) { SC.left = -ext; SC.right = ext; SC.top = ext; SC.bottom = -ext; SC.updateProjectionMatrix(); }
    sun.target.position.copy(shadowFocus);
    sun.position.copy(shadowFocus).addScaledVector(GU.uSunDir.value, 320);
    sky.position.copy(camera.position);
    // seeds: in the climax they lift toward the sky
    if (state === 'CLIMAX' && climaxT > 2 && climaxT < 16) {
      const rate = seedCap * 0.18 * dt * (0.5 + smooth(4, 9, climaxT));
      for (let k = 0; k < rate + prng(); k++) {
        const m = mills[Math.floor(prng() * mills.length)];
        const a = prng() * TAU, r = 4 + prng() * 40;
        const px = m.base.x + Math.cos(a) * r, pz = m.base.z + Math.sin(a) * r;
        spawnSeed(px, groundAt(px, pz) + 1, pz, (prng() - 0.5) * 2, 2.5 + prng() * 2.5, (prng() - 0.5) * 2, 6 + prng() * 4);
      }
    }
    updateSeeds(dt);
    updateAudio();
    if (bloom) bloom.strength += (bloomGoal - bloom.strength) * Math.min(1, dt * 1.5);
    if (bloom) bloom.threshold = state === 'CLIMAX' ? 0.92 : 0.95;
    qualityMonitor(raw);
    if (QS[qName].bloom > 0) composer.render(); else renderer.render(scene, camera);
  } catch (err) {
    if (window.__errors.length < 20) window.__errors.push('frame: ' + (err && err.message || err));
  }
  window.__test = {
    state: (free ? 'FREE_' : '') + state, target, done, climaxT: +climaxT.toFixed(2), climax: climaxSeen, peak: peakSeen,
    free: freeSeen, freeTouches, freeMoves, fps: +fpsNow.toFixed(1), q: qName, frames, waves: WU.uWN.value,
    finished: freeSeen && freeTouches >= 1 && freeMoves >= 2,
  };
}

// ================================================================ start
nearGeo.instanceCount = QS[qName].near; farGeo.instanceCount = QS[qName].far;
updateDay(0);
camTo(() => millGoal(mills[0], STAGE_BOUND[0]), 0);
onResize();
renderer.compile(scene, camera);
requestAnimationFrame(() => {
  frame();
  setState('WAIT'); setHintTarget(0); idleT = 0;
  const ld = document.getElementById('ld'); if (ld) { ld.style.opacity = '0'; setTimeout(() => ld.remove(), 1000); }
  window.__ready = true;
});
</script>
