<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ------------------------------------------------------------------ params
const PRM = new URLSearchParams(location.search);
const AUTOTEST = PRM.has('autotest');
const QF = ['low', 'mid', 'high'].includes(PRM.get('q')) ? PRM.get('q') : null;
const QS = {
  low:  { pr: 0.85, grass: 6000,  drops: 350,  sparks: 500,  shadow: 512,  seg: 0, bloom: 0 },
  mid:  { pr: 1.1,  grass: 15000, drops: 800,  sparks: 1000, shadow: 1024, seg: 1, bloom: 1 },
  high: { pr: 1.5,  grass: 28000, drops: 1600, sparks: 1600, shadow: 2048, seg: 2, bloom: 2 },
};
const QORDER = ['low', 'mid', 'high'];
let qName = QF || 'mid';
let Q = QS[qName];
const Q0 = Q;                       // geometry detail is fixed at start
const MAXQ = QF ? QS[QF] : QS.high; // pool sizes
const GLASS_OK = qName !== 'low';

// ------------------------------------------------------------------ utils
const D2R = Math.PI / 180, PI = Math.PI, TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let seed = 1407;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const rr = (a, b) => a + (b - a) * rnd();
const errSeen = new Set();
function pushErr(e) { const m = String((e && e.stack) || e); if (!errSeen.has(m)) { errSeen.add(m); window.__errors.push(m); console.error(m); } }

// ------------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({ antialias: qName !== 'low', powerPreference: 'high-performance', alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.pr));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.1, 900);
scene.add(camera);

// ------------------------------------------------------------------ light / stage colours
const SUN_AZ = -20 * D2R, SUN_EL = 42 * D2R;
const sunDir = new THREE.Vector3(Math.cos(SUN_AZ) * Math.cos(SUN_EL), Math.sin(SUN_EL), Math.sin(SUN_AZ) * Math.cos(SUN_EL)).normalize();
const C = h => new THREE.Color(h);
const STAGES = [
  { top: C(0x70BDEB), hor: C(0xDCECEF), grass: C(0x45972D), shade: C(0x285D39), sun: C(0xFFF4DF), sunI: 2.0, hemiI: 1.3, fog: C(0xD7EBE8), fn: 35, ff: 150, bloom: 0.30, exp: 1.00, cover: 0.56, rain: 1.0, shafts: 0.05 },
  { top: C(0x59BBF1), hor: C(0xDEF5FA), grass: C(0x65B53D), shade: C(0x316E42), sun: C(0xFFF1D2), sunI: 2.4, hemiI: 1.5, fog: C(0xD5EEF4), fn: 45, ff: 180, bloom: 0.45, exp: 1.05, cover: 0.64, rain: 0.25, shafts: 0.10 },
  { top: C(0x77B9E8), hor: C(0xFFE8BC), grass: C(0x83B849), shade: C(0x407047), sun: C(0xFFDBA0), sunI: 2.7, hemiI: 1.6, fog: C(0xF2E4CC), fn: 50, ff: 200, bloom: 0.65, exp: 1.10, cover: 0.62, rain: 0.0, shafts: 0.09 },
];
// shared uniforms (linear colours)
const U = {
  uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uGrass: { value: new THREE.Color() }, uShade: { value: new THREE.Color() },
  uSunCol: { value: new THREE.Color() }, uSunDir: { value: sunDir.clone() }, uFogCol: { value: new THREE.Color() },
  uFogNear: { value: 35 }, uFogFar: { value: 150 }, uTime: { value: 0 }, uCover: { value: 0.5 }, uRain: { value: 1 }, uSkyGain: { value: 0.8 },
};
const LS = { stage: 0, sunI: 2, hemiI: 1.3, bloom: 0.3, exp: 1, shafts: 0.05, climax: 0 };
function applyStageBlend(b) {
  const i = Math.min(1, Math.floor(b)), t = clamp(b - i, 0, 1), A = STAGES[i], B = STAGES[Math.min(2, i + 1)];
  U.uTop.value.copy(A.top).lerp(B.top, t); U.uHor.value.copy(A.hor).lerp(B.hor, t);
  U.uGrass.value.copy(A.grass).lerp(B.grass, t); U.uShade.value.copy(A.shade).lerp(B.shade, t);
  U.uSunCol.value.copy(A.sun).lerp(B.sun, t); U.uFogCol.value.copy(A.fog).lerp(B.fog, t);
  U.uFogNear.value = lerp(A.fn, B.fn, t); U.uFogFar.value = lerp(A.ff, B.ff, t);
  U.uCover.value = lerp(A.cover, B.cover, t); U.uRain.value = lerp(A.rain, B.rain, t);
  LS.sunI = lerp(A.sunI, B.sunI, t); LS.hemiI = lerp(A.hemiI, B.hemiI, t); LS.bloom = lerp(A.bloom, B.bloom, t);
  LS.exp = lerp(A.exp, B.exp, t); LS.shafts = lerp(A.shafts, B.shafts, t);
}
applyStageBlend(0);

const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.castShadow = true;
sun.shadow.mapSize.set(Q.shadow, Q.shadow);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
const SC = sun.shadow.camera; SC.near = 1; SC.far = 160; SC.left = -14; SC.right = 14; SC.top = 14; SC.bottom = -14;
scene.add(sun); scene.add(sun.target);
const hemi = new THREE.HemisphereLight(0xbfdfff, 0x335533, 1.3);
scene.add(hemi);
scene.fog = new THREE.Fog(0xd7ebe8, 35, 150);

// ------------------------------------------------------------------ GLSL helpers
const NOISE = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash12(i), hash12(i+vec2(1.0,0.0)), u.x), mix(hash12(i+vec2(0.0,1.0)), hash12(i+vec2(1.0,1.0)), u.x), u.y); }
float fbm(vec2 p){ float v = 0.0, a = 0.5; for(int i=0;i<5;i++){ v += a*vnoise(p); p = p*2.03 + vec2(1.7, 9.2); a *= 0.5; } return v; }
`;
const CLOUDSH = `
float cloudShade(vec2 w){ float n = fbm(w * 0.018 + vec2(uTime * 0.012, uTime * 0.005)); return mix(1.0, 0.62, smoothstep(uCover - 0.02, uCover + 0.14, n)); }
`;
const ENVFN = `
vec3 envApprox(vec3 d){
  float h = d.y;
  vec3 s = mix(uHor, uTop, pow(clamp(h, 0.0, 1.0), 0.5));
  float sd = max(dot(d, uSunDir), 0.0);
  s += uSunCol * pow(sd, 10.0) * 0.35;
  vec3 g = mix(uHor * 0.75, uGrass * 0.55, clamp(-h * 4.0, 0.0, 1.0));
  return h > 0.0 ? s : g;
}
`;

// ------------------------------------------------------------------ sky
const skyMat = new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position = p.xyww; }`,
  fragmentShader: `
uniform vec3 uTop, uHor, uSunCol, uSunDir, uFogCol, uGrass; uniform float uTime, uCover, uRain, uSkyGain;
varying vec3 vDir;
${NOISE}
void main(){
  vec3 d = normalize(vDir); float h = d.y;
  vec3 col = mix(uHor, uTop, 1.0 - pow(1.0 - clamp(h, 0.0, 1.0), 9.0));
  if (h < 0.0) col = mix(uHor, uFogCol, clamp(-h * 10.0, 0.0, 1.0));
  float sd = max(dot(d, uSunDir), 0.0);
  col += uSunCol * (pow(sd, 6.0) * 0.18 + pow(sd, 80.0) * 0.5);
  col += uSunCol * smoothstep(0.9990, 0.9996, sd) * 4.0;
  if (h > 0.0) {
    vec2 uv = d.xz / (h + 0.10) * 0.9 + vec2(uTime * 0.0045, uTime * 0.0016);
    float n = fbm(uv * 1.2);
    float c = smoothstep(uCover, uCover + 0.13, n) * smoothstep(0.0, 0.10, h);
    float n2 = fbm(uv * 1.2 + uSunDir.xz * 0.08);
    float lit = clamp((n - n2) * 4.0 + 0.62, 0.0, 1.0);
    vec3 cc = mix(vec3(0.60, 0.67, 0.80), vec3(1.05, 1.04, 1.02), lit);
    cc += uSunCol * pow(sd, 5.0) * 0.45 * (1.0 - c * 0.5);
    cc = mix(cc, uHor, smoothstep(0.18, 0.0, h) * 0.6);
    col = mix(col, cc, c * 0.93);
    float ang = atan(d.z, d.x);
    float rb = smoothstep(0.16, 0.03, h) * smoothstep(0.0, 0.02, h) * smoothstep(0.45, 0.7, fbm(vec2(ang * 2.5, 3.0)));
    col = mix(col, vec3(0.62, 0.67, 0.74), rb * uRain * 0.45);
  }
  float lum = dot(col, vec3(0.2126, 0.7152, 0.0722)); col = max(mix(vec3(lum), col, 1.55), 0.0);
  gl_FragColor = vec4(col * uSkyGain, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 48, 24), skyMat);
sky.frustumCulled = false; sky.renderOrder = -10;
scene.add(sky);

// environment map scene (for PMREM)
const envScene = new THREE.Scene();
const envMat = new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 uTop, uHor, uSunCol, uSunDir, uGrass, uShade; uniform float uCover; varying vec3 vDir;
${NOISE}
void main(){ vec3 d = normalize(vDir); float h = d.y;
  vec3 col = mix(uHor, uTop, pow(clamp(h,0.0,1.0), 0.45));
  float cl = smoothstep(0.45, 0.75, fbm(d.xz / (abs(h) + 0.2) * 1.5)) * smoothstep(0.0, 0.15, h);
  col = mix(col, vec3(1.0), cl * 0.7);
  float sd = max(dot(d, uSunDir), 0.0);
  col += uSunCol * (pow(sd, 400.0) * 60.0 + pow(sd, 12.0) * 0.6);
  vec3 g = mix(uGrass * 0.9, uShade * 0.7, clamp(-h * 2.0, 0.0, 1.0));
  col = h > 0.0 ? col : mix(uHor * 0.85, g, clamp(-h * 6.0, 0.0, 1.0));
  gl_FragColor = vec4(col, 1.0); }`,
});
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 48, 24), envMat));
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
function rebuildEnv() {
  const rt = pmrem.fromScene(envScene, 0.02, 0.1, 100);
  scene.environment = rt.texture;
  if (envRT) envRT.dispose();
  envRT = rt;
}
scene.environmentIntensity = 0.6;

// ------------------------------------------------------------------ layout
const RING = 21, ARC0 = -40 * D2R, ARC1 = 220 * D2R;
const MATS = ['pearl', 'sakura', 'aqua', 'pearl', 'sakura', 'aqua',
  'amethyst', 'sakura', 'aqua', 'amethyst', 'sakura', 'aqua',
  'opal', 'champagne', 'pearl', 'opal', 'champagne', 'opal'];
const CFG = [];
for (let k = 0; k < 17; k++) {
  const phi = ARC0 + (ARC1 - ARC0) * k / 16, r = RING + (k % 2 ? 0.7 : -0.7);
  const stage = k < 6 ? 0 : k < 12 ? 1 : 2;
  let R, H, N;
  if (stage === 0) { R = 1.4 + 0.07 * k; H = 2.6 + 0.08 * k; N = 8; }
  else if (stage === 1) { const j = k - 6; R = 1.75 + 0.1 * j; H = 3.0 + 0.12 * j; N = 10; }
  else { const j = k - 12; R = 2.25 + 0.09 * j; H = 3.6 + 0.12 * j; N = 12; }
  CFG.push({ k, phi, x: r * Math.cos(phi), z: r * Math.sin(phi), R, H, N, stage, mat: MATS[k] });
}
CFG.push({ k: 17, phi: -90 * D2R, x: 0, z: 0, R: 2.75, H: 4.5, N: 12, stage: 2, mat: 'opal', center: true });

// puddles
const PUD = [];
function addPud(x, z, r) { PUD.push({ x, z, r, s: rr(0, 6), level: 0 }); }
[1, 4, 7, 10, 13, 15].forEach((k, i) => { const c = CFG[k], a = c.phi + 4 * D2R; addPud(Math.cos(a) * 25.6, Math.sin(a) * 25.6, 1.6 + 0.12 * i); });
[3, 8, 12].forEach((k, i) => { const c = CFG[k], a = c.phi - 5 * D2R; addPud(Math.cos(a) * 16.2, Math.sin(a) * 16.2, 1.9 + 0.2 * i); });
addPud(0, -7.2, 2.3); addPud(Math.cos(40 * D2R) * 6.8, Math.sin(40 * D2R) * 6.8, 2.0);

// ------------------------------------------------------------------ terrain
function baseH(x, z) {
  const r = Math.hypot(x, z);
  let h = 0.55 * Math.sin(x * 0.043 + 1.3) * Math.cos(z * 0.037 - 0.7) + 0.35 * Math.sin(x * 0.083 - z * 0.067 + 2.1)
    + 0.18 * Math.sin(x * 0.17 + z * 0.13) + 0.12 * Math.cos(z * 0.21 - x * 0.05);
  h += smooth(45, 105, r) * (2.6 + 1.8 * Math.sin(Math.atan2(z, x) * 3 + 0.6) + 1.2 * Math.sin(x * 0.05 + z * 0.04));
  return h;
}
function pudRad(p, a) { return p.r * (1 + 0.16 * Math.sin(3 * a + p.s) + 0.09 * Math.sin(5 * a + 2.3 * p.s) + 0.05 * Math.sin(8 * a + 0.7 * p.s)); }
for (const p of PUD) {
  let m = 1e9;
  for (let i = 0; i < 48; i++) { const a = i / 48 * TAU; for (const f of [1.0, 1.12, 1.25]) { const rad = pudRad(p, a) * f; m = Math.min(m, baseH(p.x + Math.cos(a) * rad, p.z + Math.sin(a) * rad)); } }
  p.level = m + 0.01;
}
function pudD(p, x, z) { const dx = x - p.x, dz = z - p.z, d2 = dx * dx + dz * dz; if (d2 > p.r * p.r * 2.6) return 9; return Math.sqrt(d2) / pudRad(p, Math.atan2(dz, dx)); }
function groundH(x, z) {
  let h = baseH(x, z);
  for (const p of PUD) { const d = pudD(p, x, z); if (d < 1.2) { const w = 1 - smooth(0.82, 1.18, d); h = h * (1 - w) + (p.level - 0.12) * w; } }
  return h;
}
function inPuddle(x, z) { for (const p of PUD) { const d = pudD(p, x, z); if (d < 0.98) return p; } return null; }

const TSEG = [90, 130, 170][Q0.seg];
const terrGeo = new THREE.PlaneGeometry(220, 220, TSEG, TSEG);
terrGeo.rotateX(-PI / 2);
{
  const pos = terrGeo.attributes.position, col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, groundH(x, z));
    let v = 0.78 + 0.13 * Math.sin(x * 0.21 + Math.sin(z * 0.17) * 2) + 0.09 * Math.sin(z * 0.33 - x * 0.12);
    let wet = 0; for (const p of PUD) { const d = pudD(p, x, z); wet = Math.max(wet, 1 - smooth(0.9, 1.6, d)); }
    v *= 1 - wet * 0.35;
    col[i * 3] = v * (1 - wet * 0.1); col[i * 3 + 1] = v; col[i * 3 + 2] = v * (0.9 + wet * 0.2);
  }
  terrGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  terrGeo.computeVertexNormals();
}
const terrMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.82, metalness: 0, color: 0x45972d });
terrMat.onBeforeCompile = (sh) => {
  sh.uniforms.uShade = U.uShade; sh.uniforms.uTime = U.uTime; sh.uniforms.uCover = U.uCover;
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec2 vGW;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvGW = (modelMatrix * vec4(position, 1.0)).xz;');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform vec3 uShade; uniform float uTime, uCover; varying vec2 vGW;\n' + NOISE + CLOUDSH)
    .replace('#include <color_fragment>', `#include <color_fragment>
      float gn = fbm(vGW * 0.35) * 0.6 + vnoise(vGW * 3.1) * 0.25 + vnoise(vGW * vec2(9.0, 23.0)) * 0.15;
      diffuseColor.rgb = mix(uShade * 0.95, diffuseColor.rgb * 1.05, smoothstep(0.25, 0.75, gn));
      float warm = smoothstep(0.55, 0.8, fbm(vGW * 0.06 + 7.0));
      diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(1.18, 1.08, 0.7), warm * 0.55);
      diffuseColor.rgb *= cloudShade(vGW);`)
    .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\nroughnessFactor = mix(0.55, 0.9, vnoise(vGW * 0.8));');
};
const terrain = new THREE.Mesh(terrGeo, terrMat);
terrain.receiveShadow = true;
scene.add(terrain);

// distant hills ring
{
  const n = 160, pos = [], hv = [], idx = [];
  for (let i = 0; i <= n; i++) {
    const a = i / n * TAU, rad = 168;
    const top = 6 + 7 * Math.sin(a * 3 + 1.1) * 0.5 + 5 * Math.sin(a * 7 + 0.3) * 0.5 + 3 * Math.sin(a * 13) * 0.3 + 6;
    pos.push(Math.cos(a) * rad, -6, Math.sin(a) * rad, Math.cos(a) * rad, top, Math.sin(a) * rad);
    hv.push(0, 1, 0, 1);
    if (i < n) { const b = i * 2; idx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aH', new THREE.Float32BufferAttribute(hv, 1));
  g.setIndex(idx);
  const m = new THREE.ShaderMaterial({
    uniforms: U, side: THREE.DoubleSide, fog: false,
    vertexShader: `attribute float aH; varying float vH; void main(){ vH = aH; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 uHor, uGrass, uFogCol, uTop; varying float vH;
      void main(){ vec3 c = mix(uGrass * 0.55 + uTop * 0.3, uHor, 0.3 + vH * 0.15); c = mix(uFogCol, c, 0.85);
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      }`,
  });
  const hills = new THREE.Mesh(g, m); hills.frustumCulled = false; scene.add(hills);
}

// ------------------------------------------------------------------ grass (instanced tufts)
function tuftGeometry(blades, segs) {
  const P = [], N = [], UV = [], I = [];
  for (let b = 0; b < blades; b++) {
    const yaw = rnd() * TAU, ox = rr(-0.16, 0.16), oz = rr(-0.16, 0.16), h = rr(0.55, 1.0), w = rr(0.06, 0.09), lean = rr(0.12, 0.38);
    const dx = Math.cos(yaw), dz = Math.sin(yaw), sx = -dz, sz = dx, base = P.length / 3;
    for (let s = 0; s <= segs; s++) {
      const t = s / segs, ww = w * Math.pow(1 - t, 0.85) * 0.5, cx = ox + dx * lean * t * t, cz = oz + dz * lean * t * t, cy = h * t;
      const nx = dx * 0.35, nz = dz * 0.35, nl = Math.hypot(nx, 1, nz);
      if (s < segs) {
        P.push(cx - sx * ww, cy, cz - sz * ww, cx + sx * ww, cy, cz + sz * ww);
        N.push(nx / nl, 1 / nl, nz / nl, nx / nl, 1 / nl, nz / nl); UV.push(0, t, 1, t);
      } else { P.push(cx, cy, cz); N.push(nx / nl, 1 / nl, nz / nl); UV.push(0.5, 1); }
    }
    for (let s = 0; s < segs - 1; s++) { const a = base + s * 2; I.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    const a = base + (segs - 1) * 2; I.push(a, a + 1, a + 2);
  }
