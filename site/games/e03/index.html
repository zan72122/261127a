function monitorPerf(rawDt) {
  if (QFIX || document.hidden) return;
  perf.acc += rawDt; perf.frames++; perf.cool -= rawDt;
  if (perf.acc < 1) return;
  const fps = perf.frames / perf.acc; perf.acc = 0; perf.frames = 0;
  if (perf.skip > 0) { perf.skip--; return; }
  perf.samples.push(fps); if (perf.samples.length > 12) perf.samples.shift();
  if (perf.cool > 0) return;
  const qi = Q_ORDER.indexOf(qName);
  const last = (n) => perf.samples.slice(-n);
  const avg = (a) => a.reduce((s, x) => s + x, 0) / a.length;
  if (perf.samples.length >= 3 && avg(last(3)) < 50 && qi > 0) { applyQuality(Q_ORDER[qi - 1]); perf.samples = []; perf.cool = 8; perf.skip = 2; }
  else if (perf.samples.length >= 10 && Math.min(...last(10)) >= 58 && qi < 2 && G.state !== 'CLIMAX') { applyQuality(Q_ORDER[qi + 1]); perf.samples = []; perf.cool = 20; perf.skip = 3; }
}

// ---------------------------------------------------------------- resize
function onResize(snap = true) {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h); camera.fov = camera.aspect < 1 ? 48 : 42; camera.updateProjectionMatrix();
  const pr = renderer.getPixelRatio();
  if (composer) {
    composer.setPixelRatio(pr); composer.setSize(w, h);
    if (QUAL[qName].bloom === 1) bloomPass.setSize(Math.round(w * pr * 0.5), Math.round(h * pr * 0.5));
  }
  const sc = h * pr * 0.5 / Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  dropU.uScale.value = sc; steamU.uScale.value = sc; steamU.uAspect.value = camera.aspect;
  if (snap && CAM.shotFn) {
    const s = CAM.shotFn();
    if (CAM.t >= 1) { CAM.pos.copy(s.pos); CAM.look.copy(s.look); }
    CAM.toPos.copy(s.pos); CAM.toLook.copy(s.look);
  }
}
window.addEventListener('resize', () => onResize(true));

// ---------------------------------------------------------------- autotest driver (real pointer events)
const AT = { on: AUTOTEST, holding: false, plan: null, wait: 0.6, pid: 31, n: 0, partialDone: false, log: [] };
function atDispatch(type, x, y) {
  const ev = new PointerEvent(type, { pointerId: AT.pid, clientX: x, clientY: y, bubbles: true, cancelable: true, pointerType: AT.n % 2 ? 'mouse' : 'touch', isPrimary: true, button: 0, buttons: type === 'pointerdown' ? 1 : 0 });
  canvas.dispatchEvent(ev);
}
function autotestTick(dt) {
  if (!AT.on) return;
  AT.wait -= dt;
  if (!AT.holding) {
    if (G.state === 'READY' && CAM.t >= 1 && AT.wait <= 0 && G.resets === 0) {
      const s = pumpScreen(G.target); AT.x = s.x; AT.y = s.y; AT.n++;
      atDispatch('pointerdown', s.x, s.y);
      if (G.holding) { AT.holding = true; AT.plan = (!AT.partialDone && G.count === 0) ? 'partial' : 'full'; AT.heldFull = 0; }
      else AT.wait = 0.5;
    }
  } else {
    const P = PUMPS[G.target];
    if (AT.plan === 'partial' && P.p > 0.45) { atDispatch('pointerup', AT.x, AT.y); AT.holding = false; AT.partialDone = true; AT.wait = 0.7; AT.log.push('partial release p=' + P.p.toFixed(2)); }
    else if (G.state === 'CHARGED') { AT.heldFull += dt; if (AT.heldFull > 0.4) { atDispatch('pointerup', AT.x, AT.y); AT.holding = false; AT.wait = 0.4; } }
    else if (!G.holding) { AT.holding = false; AT.wait = 0.5; }
  }
}

// ---------------------------------------------------------------- per-frame update
const tmpCol = new THREE.Color();
function updateEnv(dt) {
  const prev = G.envT;
  G.envT += clamp(G.envTarget - G.envT, -G.envRate * dt, G.envRate * dt);
  const e = sampleEnv(G.envT);
  U.uZen.value.copy(e.zen); U.uHor.value.copy(e.hor); U.uFogCol.value.copy(e.fog); U.uFog.value.set(e.fn * 1.7, e.ff * 1.8);
  const el = THREE.MathUtils.degToRad(e.el), az = THREE.MathUtils.degToRad(e.az);
  U.uSunDir.value.set(-Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)).normalize();
  U.uSunCol.value.copy(e.sun);
  sun.color.copy(e.sun).lerp(tmpCol.set('#ffffff'), 0.35); sun.intensity = e.dir * LIGHT_SCALE;
  sun.position.copy(sun.target.position).addScaledVector(U.uSunDir.value, 90);
  hemi.intensity = e.hemi * 0.42; hemi.color.copy(e.zen).lerp(e.hor, 0.75); hemi.groundColor.set('#cfd2c8').lerp(e.sun, 0.15);
  if (!scene.fog) scene.fog = new THREE.Fog(e.fog, e.fn, e.ff);
  scene.fog.color.copy(e.fog); scene.fog.near = e.fn * 1.7; scene.fog.far = e.ff * 1.8;
  mountainMat.color.copy(tmpCol.set('#ffffff').lerp(e.hor, 0.25));
  if (Math.abs(G.envT - envBakedAt) > 0.34 || (prev !== G.envT && G.envT === G.envTarget && Math.abs(G.envT - envBakedAt) > 0.02)) bakeEnv(G.envT);
}
function updatePumps(dt) {
  const t = G.time;
  PUMPS.forEach(P => {
    const isT = P.i === G.target && (G.state === 'READY' || G.state === 'CHARGING' || G.state === 'CHARGED' || G.state === 'TRANSITION');
    const holdingThis = isT && G.holding;
    if (holdingThis && G.state === 'CHARGING') {
      const S = STAGES[G.stage];
      P.p = Math.min(1, P.p + dt / S.charge);
      if (P.p >= 1) { setState('CHARGED'); AU.full(NOTES[P.i]); P.kick = 0.6; }
    }
    if (holdingThis) AU.updateCharge(P.p, G.state === 'CHARGED');
    // piston target depth
    const full = P.p >= 1;
    let target = P.p * 0.16;
    if (full) target = 0.13 + 0.008 * Math.sin(t * 5);
    if (P.kick > 0) P.kick = Math.max(0, P.kick - dt * 3);
    // spring
    const k = 120, c = 14; const a = (target - P.press) * k - P.pressV * c; P.pressV += a * dt; P.press += P.pressV * dt;
    P.press = clamp(P.press, -0.05, 0.2);
    let bob = 0;
    if (P.bob > 0) { P.bob = Math.max(0, P.bob - dt * 2.5); bob = Math.sin(P.bob * Math.PI * 3) * 0.02 * P.bob; }
    const hinting = isT && G.state === 'READY' && G.idle > 3;
    if (hinting) bob += Math.max(0, Math.sin((G.idle - 3) * 2.4)) * 0.025;
    P.piston.position.y = 1.86 - P.press + bob;
    // water in the glass
    const lvl = 0.05 + P.p * 1.05;
    P.waterIn.scale.y = lvl; P.waterIn.position.y = 0.42 + lvl / 2 + (P.p > 0.25 ? Math.sin(t * 13) * 0.004 : 0);
    P.waterIn.material.emissiveIntensity = 0.06 + P.p * 0.35;
    // needle
    const na = lerp(2.0, -2.0, P.p) + (P.p > 0.6 ? Math.sin(t * 31) * 0.03 * P.p : 0);
    P.needleA += (na - P.needleA) * (1 - Math.exp(-dt * 10)); P.needle.rotation.z = P.needleA;
    // ring
    const pulse = full ? 0.5 + 0.5 * Math.sin(t * 3.2) : (hinting ? 0.35 + 0.35 * Math.sin(G.idle * 3) : 0);
    P.ringU.uFill.value = P.p; P.ringU.uPulse.value = pulse;
    P.ringU.uBase.value = isT ? 0.12 + (hinting ? 0.25 * Math.max(0, Math.sin(G.idle * 3)) : 0.05) : 0.05;
    // inset glow invites touch
    const inv = isT && (G.state === 'READY' || G.state === 'TRANSITION') ? 0.35 + 0.3 * Math.sin(t * 2.2) + (hinting ? 0.25 : 0) : (isT ? 0.5 : 0.03);
    P.insetMat.emissiveIntensity += (inv - P.insetMat.emissiveIntensity) * (1 - Math.exp(-dt * 6));
    // pipe light
    const since = t - P.fireT;
    if (since < 0.6) { P.pipeU.uProg.value = since / 0.12; P.pipeU.uBand.value = since < 0.12 ? 1 : Math.max(0, 1 - (since - 0.12) * 3); }
    else if (holdingThis && P.p > 0.5) { P.pipeU.uProg.value = (t * 0.9) % 1; P.pipeU.uBand.value = 0.4 * smooth(0.5, 0.75, P.p); }
    else P.pipeU.uBand.value = Math.max(0, P.pipeU.uBand.value - dt * 3);
    P.pipeU.uFill.value = isT ? P.p : 0;
    P.pipeU.uSeq.value = G.finalCharge && G.holding ? ((t * 0.7 + P.i * 0.2) % 1) + 0.0001 : 0;
    // tiny pipe shake around 50-75 %
    P.grp.position.x = P.pos.x + (holdingThis && P.p > 0.5 && !full ? Math.sin(t * 60) * 0.004 : 0);
    // steam from the vent when nearly full
    if (holdingThis && P.p > 0.75 && Math.random() < dt * 6) spawnSteam(P.pool.vent.x + rnd(-0.3, 0.3), P.pool.vent.y + 0.1, P.pool.vent.z + rnd(-0.3, 0.3), rnd(0.9, 1.6), rnd(2, 3), rnd(0.6, 1.1), 0.9);
    if (G.finalCharge && G.holding && Math.random() < dt * 2.5) spawnSteam(P.pool.vent.x + rnd(-0.3, 0.3), P.pool.vent.y + 0.1, P.pool.vent.z + rnd(-0.3, 0.3), rnd(0.9, 1.5), rnd(2, 3), rnd(0.5, 1.0), 0.8);
  });
}
function updateAmbientSteam(dt) {
  POOLS.forEach((p, i) => {
    const aw = waterU.uAwake.value[i];
    if (Math.random() < dt * (0.5 + aw * 0.9) * (sCap / 180)) {
      const a = Math.random() * 6.283, r = Math.random() * p.R * 0.8;
      spawnSteam(p.x + Math.cos(a) * r, p.level + 0.1, p.z + Math.sin(a) * r, rnd(1.6, 3.2), rnd(5, 8), rnd(0.25, 0.5), 0.55 + aw * 0.25);
    }
    const tgt = p.awakeTarget || 0;
    waterU.uAwake.value[i] += (tgt - waterU.uAwake.value[i]) * (1 - Math.exp(-dt * 1.5));
  });
}
function updateGame(dt) {
  G.time += dt; G.stateT += dt;
  for (let k = G.events.length - 1; k >= 0; k--) { const e = G.events[k]; if (G.time >= e.t) { G.events.splice(k, 1); e.fn(); } }
  switch (G.state) {
    case 'READY':
      G.idle += dt;
      if (G.idle > 7.5 && !G.chimed) { G.chimed = true; AU.chime(); }
      break;
    case 'ERUPTION': {
      const D = STAGES[Math.min(2, G.stage)].D;
      if (G.stateT > D * 0.82) nextTarget();
      break;
    }
    case 'TRANSITION':
      if (CAM.t >= 1) { setState('READY'); G.idle = 0; }
      break;
    case 'CLIMAX': G.climaxT += dt; break;
    case 'AFTERGLOW':
      if (G.stateT > 8) {
        setState('RESET'); G.envTarget = 0; G.envRate = 0.7;
        G.stage = 0; G.step = 0; G.count = 0; G.target = ORDERS[0][0];
        POOLS.forEach(p => { p.awakeTarget = 0; });
        PUMPS.forEach(P => { P.p = 0; });
        camTo(() => shotPump(ORDERS[0][0], 0), 3.0);
      }
      break;
    case 'RESET':
      if (G.stateT > 3 && CAM.t >= 1) { setState('READY'); G.idle = 0; G.chimed = false; G.resets++; console.log('[e03] reset complete'); }
      break;
  }
  G.success = Math.max(0, G.success - dt * 0.25);
}
let bloomNow = 0.35;
function updatePost(dt) {
  let target = 0.35, exp = 1.0;
  if (G.state === 'ERUPTION' || G.success > 0.2) target = lerp(0.35, 0.68, clamp(G.success * 1.4, 0, 1));
  if (G.state === 'CLIMAX') { target = 0.92 + (G.climaxT > 22 && G.climaxT < 28 ? 0.15 : 0); exp = 1.05; }
  if (G.state === 'AFTERGLOW') { target = lerp(0.9, 0.45, clamp(G.stateT / 8, 0, 1)); exp = 1.03; }
  bloomNow += (target - bloomNow) * (1 - Math.exp(-dt * 1.5));
  renderer.toneMappingExposure += (exp - renderer.toneMappingExposure) * (1 - Math.exp(-dt));
  if (bloomPass) { bloomPass.strength = Math.min(1.2, bloomNow); bloomPass.threshold = 0.9; bloomPass.radius = 0.35; }
  // particle dimming when many drops are in the air keeps highlights from stacking up
  let alive = 0; for (let i = 0; i < dCap; i += 8) if (dLife[i] > 0) alive++;
  dropU.uDim.value = 1 / (1 + (alive * 8 / dCap) * 0.6);
}
function updateGuard() {
  if (G.state === 'READY' || G.state === 'CHARGING' || G.state === 'CHARGED' || G.state === 'TRANSITION') {
    const s = pumpScreen(G.target); steamU.uGuard.value.set(s.ndcX, s.ndcY, 1);
  } else steamU.uGuard.value.z = 0;
}

let lastT = performance.now(), frameCount = 0;
function frame(now) {
  requestAnimationFrame(frame);
  try {
    let raw = (now - lastT) / 1000; lastT = now;
    if (!(raw > 0)) raw = 0.016;
    monitorPerf(raw);
    const dt = Math.min(raw, AUTOTEST ? 0.2 : 0.1);
    U.uTime.value += dt;
    autotestTick(dt);
    updateGame(dt);
    updateEnv(dt);
    updatePumps(dt);
    updateGeysers(dt);
    updateRain(dt);
    updateDrops(dt);
    updateAmbientSteam(dt);
    updateSteam(dt);
    updateCamera(dt);
    sky.position.copy(camera.position);
    updateBow(BOW.A, bowUniforms.uBowA, bowUniforms.uBowRA, dt);
    updateBow(BOW.B, bowUniforms.uBowB, bowUniforms.uBowRB, dt);
    updateGuard();
    updatePost(dt);
    if (QUAL[qName].bloom > 0 && composer) composer.render(); else renderer.render(scene, camera);
    frameCount++;
    if (frameCount === 2) { window.__ready = true; console.log('[e03] ready q=' + qName); }
  } catch (err) {
    if (window.__errors.length < 20) window.__errors.push('frame: ' + (err && err.stack || err));
  }
}

// ---------------------------------------------------------------- start
updateEnv(0); bakeEnv(0);
if (Q0.bloom > 0) ensureComposer();
onResize(false);
camSnap(() => shotPump(G.target, 0));
updateCamera(0);
window.__game = {
  get state() { return G.state; }, get stage() { return G.stage; }, get count() { return G.count; }, get target() { return G.target; },
  get pressure() { return PUMPS[G.target].p; }, get climaxReached() { return G.climaxReached; }, get climaxT() { return G.climaxT; },
  get resets() { return G.resets; }, get q() { return qName; }, get eruptions() { return G.eruptions; }, get autotestLog() { return AT.log.slice(); },
  targetScreen() { return pumpScreen(G.target); },
  snapshot() { const s = pumpScreen(G.target); return { state: G.state, stage: G.stage, count: G.count, target: G.target, p: +PUMPS[G.target].p.toFixed(2), climax: G.climaxReached, climaxT: +G.climaxT.toFixed(1), resets: G.resets, q: qName, pump: { x: Math.round(s.x), y: Math.round(s.y) } }; }
};
requestAnimationFrame(frame);

} catch (err) {
  window.__errors.push('init: ' + (err && err.stack || err));
  console.error(err);
}
</script>
