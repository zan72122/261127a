// ================================================================ procedural textures
const TS = QB.tex;

      #else

      #endif

      float sw = (sin(uT * 1.6 + ph) * 0.6 + sin(uT * 2.7 + ph * 1.7) * 0.4) * (uWind + wv * 1.6);

      transformed.z += cos(uT * 1.3 + ph * 1.3) * (uWind * 0.5 + wv) * hh * hh * ${(o.sway * .6).toFixed(3)};
      transformed.y -= abs(sw) * hh * hh * ${(o.sway * .25).toFixed(3)};`;

      #ifdef USE_INSTANCING
        float wph = instanceMatrix[3][0] * 1.7 + instanceMatrix[3][2] * 1.3;
      #else
        float wph = 0.0;
      #endif

}
function updateParticles(dt) {
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (!p.on) { pA[i] = 0; continue; }
    p.life += dt; if (p.life >= p.max) { p.on = false; pA[i] = 0; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vy *= (1 - dt * .3);
    const k = p.life / p.max;

    pA[i] = p.a * smooth(0, .12, k) * (1 - smooth(.6, 1, k)) * (.75 + .25 * Math.sin(G.time * 9 + i));

}

// ================================================================ autotest (drives the same input handlers)
const AT = { waits: [] };
const gWait = (sec) => new Promise(res => AT.waits.push({ t: G.time + sec, res }));
const frameWait = () => new Promise(res => AT.waits.push({ frame: true, res }));
const until = (fn) => new Promise(res => AT.waits.push({ fn, res }));
function atTick() { const keep = []; for (const w of AT.waits) { if ((w.frame) || (w.t !== undefined && G.time >= w.t) || (w.fn && w.fn())) w.res(); else keep.push(w); } AT.waits = keep; }
const fake = (id, x, y) => ({ pointerId: id, clientX: x, clientY: y, pointerType: 'touch', isPrimary: id === 1, preventDefault() {} });
async function atDrag(free, frac, opts = {}) {
  const hs = handleScreenInfo(free ? null : activeUnit());
  const x0 = hs.x + 6, y0 = hs.y + 4, need = clamp(hs.px * 1.25, 45, 90), total = need * frac;
  onDown(fake(1, x0, y0), true); await frameWait();
  if (opts.wrong) { for (let k = 1; k <= 4; k++) { onMove(fake(1, x0 - hs.dx * 10 * k, y0 - hs.dy * 10 * k)); await frameWait(); } }
  const steps = 9;
  for (let k = 1; k <= steps; k++) {
    const d = total * k / steps, wob = Math.sin(k * .9) * 8;
    onMove(fake(1, x0 + hs.dx * d - hs.dy * wob, y0 + hs.dy * d + hs.dx * wob));
    if (opts.multi && k === 3) onDown(fake(2, x0 + 120, y0 - 80), true);
    await frameWait();

}
async function autoRun() {
  await gWait(1.6);
  for (let n = 0; n < 18; n++) {
    await until(() => (G.state === 'idle' || G.state === 'start') && cam.target.distanceTo(cam.tTarget) < .05 && Math.abs(cam.dist - cam.tDist) < .5);
    await gWait(.35);
    if (n === 0) { const hs = handleScreenInfo(activeUnit()); onDown(fake(1, hs.x, hs.y), true); await frameWait(); onUp(fake(1, hs.x, hs.y)); await gWait(1.2); }
    if (n === 3) { await atDrag(false, .35); await gWait(.8); }
    if (n === 7) { await gWait(3.6); } // let the guidance play once
    await atDrag(false, 1.1, { wrong: n === 5, multi: n === 10 });
    await until(() => G.state !== 'drag' && G.state !== 'idle');
  }
  await until(() => G.state === 'free');
  await gWait(1.0);
  await atDrag(true, 1.1);
  await until(() => G.freeWave > 6 || (G.freeWave < 0 && G.freeCount > 0 && FREE.ret <= 0));
  await gWait(.6);
  T.finished = true;
}

// ================================================================ main loop
let lastT = performance.now();
let started = false;
function frame() {
  requestAnimationFrame(frame);
  const tn = performance.now(), raw = Math.min((tn - lastT) / 1000, 1); lastT = tn;
  const dt = Math.min(raw, AUTOTEST ? .2 : .1);
  try {
    update(dt);
    perfTick(dt, raw);
    if (bloomOn && composer) composer.render(); else renderer.render(scene, camera);
    T.frames++;
    if (AUTOTEST) atTick();
  } catch (e) {
    window.__errors.push('frame: ' + (e && e.message || e));
    if (window.__errors.length > 50) throw e;
  }
}
function boot() {
  evalTod(0); tod.p = 0; tod.target = 0;
  setQuality(qName);
  U.px.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * Math.tan(42 * D2R / 2));
  const pre = AUTOTEST ? 0 : clamp(parseInt(URLP.get('pre') || '0', 10) || 0, 0, 18);
  if (pre) { for (let i = 0; i < pre; i++) { units[ORDER[i]].st = 'done'; units[ORDER[i]].glowT = -99; units[ORDER[i]].dirty = true; units[ORDER[i]].prog = 1; units[ORDER[i]].rise = 1; } G.n = pre; T.done = pre; tod.p = tod.target = pre / 6; G.state = pre >= 18 ? 'climax' : 'idle'; if (pre >= 18) { startClimax(); G.climaxT = parseFloat(URLP.get('ct') || '0'); tod.p = 3 + smooth(10.5, 13.5, G.climaxT); } }
  if (G.n >= 18) endFraming(.1); else stageFraming(.1);
  applyCam(1);
  update(0.016);
  updateEnv(); renderer.shadowMap.needsUpdate = true;
  if (bloomOn && composer) composer.render(); else renderer.render(scene, camera);
  const ld = document.getElementById('ld'); if (ld) { ld.style.opacity = '0'; setTimeout(() => ld.remove(), 900); }
  window.__ready = true;
  lastT = performance.now();
  requestAnimationFrame(frame);
  if (AUTOTEST) autoRun().catch(e => window.__errors.push('autotest: ' + (e && e.message || e)));
}
boot();
