<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ============================================================ basics
const QS = new URLSearchParams(location.search);
const AUTO = QS.has('autotest');
const QFIX = ['low', 'mid', 'high'].includes(QS.get('q')) ? QS.get('q') : null;
const TSCALE = AUTO ? clampN(parseFloat(QS.get('ts') || '1') || 1, 0.25, 8) : 1;
function clampN(x, a, b) { return Math.min(b, Math.max(a, x)); }
const clamp = clampN;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const ease5 = (t) => { t = clamp(t, 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); };
const D2R = Math.PI / 180;
const logErr = (e) => { try { window.__errors.push(String((e && (e.stack || e.message)) || e)); } catch (_) {} };
const alog = (...a) => { if (AUTO) console.log('[e06]', ...a); };

const QUAL = {
  low:  { pr: 1.0,  shadow: 0,    bloom: 0,   oct: 2, waves: 2, parts: 60,  refl: 0.3,  seg: 40 },
  mid:  { pr: 1.25, shadow: 1024, bloom: 0.5, oct: 3, waves: 3, parts: 160, refl: 0.4,  seg: 64 },
  high: { pr: 1.75, shadow: 2048, bloom: 1,   oct: 5, waves: 4, parts: 350, refl: 0.5,  seg: 96 }
};
const QORDER = ['low', 'mid', 'high'];
let qName = QFIX || 'mid';

// world layout: 6 columns x 4 rows, cell 12m x 24m, area x[-36,36] z[0,-96]
const COLS = 6, ROWS = 4, CW = 12, CD = 24;
const AREA_W = COLS * CW, AREA_D = ROWS * CD;
const ORDER = [
  [2, 0], [3, 0], [1, 0], [4, 0], [0, 0], [5, 0],
  [5, 1], [4, 1], [3, 1], [2, 1], [1, 1], [0, 1],
  [0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [5, 2],
  [5, 3], [4, 3], [0, 3], [1, 3], [3, 3], [2, 3]
];
const cellX = (c) => -AREA_W / 2 + CW * (c + 0.5);
const cellZ0 = (r) => -CD * r;
const DRUM_R = 0.9;
const SUN_AZ = 35 * D2R;

// stage palette (index 0..3)
const PAL = {
  zen: ['#769DCE', '#79B5DF', '#65BCEB', '#56B8F0'],
  hor: ['#FFD5BF', '#FFDCC4', '#FFE4BE', '#FFECD0'],
  clit: ['#FFD0CE', '#FFD5B7', '#FFE2BC', '#FFF0D8'],
  cshade: ['#A5B5D4', '#ADC2DD', '#B5CDE5', '#C2D8ED'],
  mount: ['#879CBF', '#92B3D0', '#9CBDD5', '#ABC8DB'],
  kelvin: [3500, 4100, 4700, 5300],
  elev: [3, 5, 7.5, 10],
  dirI: [2.0, 2.4, 2.8, 3.2],
  hemiI: [1.3, 1.4, 1.5, 1.6],
  bloom: [0.25, 0.35, 0.5, 0.65]
};
const palCol = {};
for (const k of ['zen', 'hor', 'clit', 'cshade', 'mount']) palCol[k] = PAL[k].map((h) => new THREE.Color(h));
function kelvinColor(k, out) {
  const t = k / 100; let r, g, b;
  if (t <= 66) { r = 255; g = 99.4708025861 * Math.log(t) - 161.1195681661; }
  else { r = 329.698727446 * Math.pow(t - 60, -0.1332047592); g = 288.1221695283 * Math.pow(t - 60, -0.0755148492); }
  if (t >= 66) b = 255; else if (t <= 19) b = 0; else b = 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  out.setRGB(clamp(r, 0, 255) / 255, clamp(g, 0, 255) / 255, clamp(b, 0, 255) / 255, THREE.SRGBColorSpace);
  return out;
}
function palLerpColor(key, s, out) {
  const i = Math.min(2, Math.floor(s)), f = clamp(s - i, 0, 1);
  return out.copy(palCol[key][i]).lerp(palCol[key][i + 1], f);
}
function palLerp(key, s) {
  const i = Math.min(2, Math.floor(s)), f = clamp(s - i, 0, 1);
  return lerp(PAL[key][i], PAL[key][i + 1], f);
}

// mountain profile shared by mesh (JS) and sky / reflection (GLSL)
function mountH(az) {
  let h = 30 + 20 * Math.sin(3 * az + 1.3) + 13 * Math.sin(7 * az + 0.4) + 7 * Math.sin(13 * az + 2.1) + 3.5 * Math.sin(29 * az + 0.7) + 1.6 * Math.sin(57 * az + 1.9) + 0.8 * Math.sin(113 * az + 0.3);
  const da = Math.atan2(Math.sin(az - SUN_AZ), Math.cos(az - SUN_AZ));
  h *= (1 - 0.72 * Math.exp(-da * da / 0.06)) * (0.75 + 0.25 * Math.cos(az));
  return Math.max(h, 6);
}
const MOUNT_R = 1300;

// ============================================================ renderer
const canvas = document.getElementById('c');
const fadeCv = document.getElementById('fade');
const fadeCtx = fadeCv.getContext('2d');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', alpha: false });
} catch (e) { logErr(e); throw e; }
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.04;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, 1, 0.5, 1900);
camera.layers.set(0);

// ============================================================ shared GLSL
const U = {
  uSunDir: { value: new THREE.Vector3(0, 0.1, -1).normalize() },
  uSunCol: { value: new THREE.Color(1, 0.8, 0.6) },
  uZen: { value: new THREE.Color() }, uHor: { value: new THREE.Color() },
  uCLit: { value: new THREE.Color() }, uCShade: { value: new THREE.Color() },
  uMount: { value: new THREE.Color() }, uFogCol: { value: new THREE.Color('#DCE5ED') },
  uTime: { value: 0 }, uCloudOct: { value: 3 }, uSunI: { value: 7 }, uSkyGain: { value: 1.0 }
};
const COMMON = /* glsl */`
uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uZen; uniform vec3 uHor; uniform vec3 uCLit; uniform vec3 uCShade;
uniform vec3 uMount; uniform vec3 uFogCol; uniform float uTime; uniform float uCloudOct; uniform float uSunI; uniform float uSkyGain;
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){ vec2 i=floor(p); vec2 f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash12(i),hash12(i+vec2(1.0,0.0)),u.x), mix(hash12(i+vec2(0.0,1.0)),hash12(i+vec2(1.0,1.0)),u.x), u.y); }
float fbm(vec2 p, float oct, float sharp){ float a=0.5; float s=0.0; float n=0.0; mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<5;i++){ float fi=float(i); if(fi>=oct) break; float w = fi<1.5 ? 1.0 : sharp; s+=a*w*vnoise(p); n+=a*w; p=m*p+vec2(3.1,1.7); a*=0.5; }
  return s/max(n,1e-3); }
const float SUN_AZ = ${SUN_AZ.toFixed(6)};
float mountH(float az){
  float h = 30.0 + 20.0*sin(3.0*az+1.3) + 13.0*sin(7.0*az+0.4) + 7.0*sin(13.0*az+2.1) + 3.5*sin(29.0*az+0.7) + 1.6*sin(57.0*az+1.9) + 0.8*sin(113.0*az+0.3);
  float da = atan(sin(az-SUN_AZ), cos(az-SUN_AZ));
  h *= (1.0 - 0.72*exp(-da*da/0.06)) * (0.75 + 0.25*cos(az));
  return max(h, 6.0);
}
vec3 mountainCol(float az, float fr){
  float rid = fbm(vec2(az*55.0, fr*2.6), 3.0, 1.0);
  float lit = 0.9 + 0.34*(rid-0.5) + 0.06*sin(az*23.0 + fr*5.0);
  vec2 sd = normalize(uSunDir.xz + vec2(1e-4));
  float sa = dot(vec2(sin(az), -cos(az)), sd);
  vec3 c = uMount * lit;
  c += uSunCol * 0.07 * max(sa, 0.0) * fr * (0.6 + rid);
  c = mix(c, mix(uHor, uFogCol, 0.5), 0.34*(1.0-fr)*(1.0-fr) + 0.06);
  return c;
}
vec3 skyCol(vec3 rd, float sharp){
  float y = rd.y;
  float e = max(y, 0.0);
  vec3 col = mix(uHor, uZen*0.80, smoothstep(0.0, 0.46, pow(e, 0.7)));
  col = mix(col, uCLit*vec3(1.0,0.76,0.86), 0.40*exp(-abs(e-0.11)*9.0));
  float mu = dot(rd, uSunDir);
  float m0 = max(mu, 0.0);
  col += uSunCol * (0.06*pow(m0,4.0) + 0.18*pow(m0,24.0) + 0.30*pow(m0,280.0));
  col = mix(col, mix(uFogCol, uHor, 0.6), exp(-e*30.0)*0.20);
  float cov = 0.0;
  if (y > 0.0) {
    vec2 uv = rd.xz/(y+0.09)*2.3 + vec2(uTime*0.006, uTime*0.002);
    float big = smoothstep(0.15, 0.6, vnoise(uv*0.16 + 4.0));
    float d = fbm(uv*1.5, uCloudOct, sharp);
    float wid = mix(0.26, 0.12, sharp);
    cov = smoothstep(0.47 - wid*0.4, 0.47 + wid, d) * big;
    float d2 = fbm(uv*1.5 + normalize(uSunDir.xz+vec2(1e-4))*0.10, uCloudOct, sharp);
    float lit = clamp(0.5 + (d - d2)*6.0 + (1.0 - d)*0.6, 0.0, 1.0);
    vec3 cl = uCLit*vec3(1.0, 0.80, 0.84);
    vec3 cc = mix(uCShade*0.92, cl, lit);
    cc += uSunCol * 0.40 * pow(m0, 6.0) * (1.0 - cov*0.5);
    cov *= smoothstep(0.0, 0.12, y) * 0.95 * (0.3 + 0.7*sharp);
    col = mix(col, cc, cov);
  }
  float hl = length(rd.xz) + 1e-4;
  float az = atan(rd.x, -rd.z);
  float mh = mountH(az) / ${MOUNT_R.toFixed(1)};
  float t = y / hl;
  if (t < mh) {
    col = mountainCol(az, clamp(t/mh, 0.0, 1.0));
  } else {
    float disk = smoothstep(0.99990, 0.99995, mu);
    col += uSunCol * uSunI * disk * (1.0 - cov*0.85);
  }
  float lm = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = max(mix(vec3(lm), col, 1.28), 0.0);
  return col * uSkyGain;
}
`;

// ============================================================ sky, env, mountains
const skyVert = `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`;
const skyFrag = (env) => COMMON + `
varying vec3 vW;
void main(){
  vec3 rd = normalize(vW - cameraPosition);
  vec3 c;
  ${env ? `if (rd.y < 0.0) { vec3 m = skyCol(vec3(rd.x, -rd.y, rd.z), 0.5); c = mix(vec3(0.74,0.73,0.70), m, 0.6); } else { c = skyCol(rd, 0.6); }`
        : `c = skyCol(rd, 1.0); if (rd.y < 0.0) c = mix(uFogCol, uHor, 0.5);`}
  gl_FragColor = vec4(c, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;
const skyMat = new THREE.ShaderMaterial({ uniforms: U, vertexShader: skyVert, fragmentShader: skyFrag(false), side: THREE.BackSide, depthWrite: false });
const sky = new THREE.Mesh(new THREE.SphereGeometry(1600, 48, 24), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);

const envScene = new THREE.Scene();
const envMat = new THREE.ShaderMaterial({ uniforms: U, vertexShader: skyVert, fragmentShader: skyFrag(true), side: THREE.BackSide, depthWrite: false });
envMat.toneMapped = false;
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), envMat));
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
function updateEnv() {
  try {
    const rt = pmrem.fromScene(envScene, 0.02, 0.1, 400);
    if (envRT) envRT.dispose();
    envRT = rt; scene.environment = rt.texture;
  } catch (e) { logErr(e); }
}

// mountains: terrain ring mesh built from the same profile, follows camera xz like the sky
{
  const N = 900, pos = [], az = [], fr = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const a = i / N * Math.PI * 2 - Math.PI;
    const h = mountH(a);
    const x = Math.sin(a) * MOUNT_R, z = -Math.cos(a) * MOUNT_R;
    pos.push(x, h, z, x * 0.985, -18, z * 0.985);
    az.push(a, a); fr.push(1, 0);
    if (i < N) { const b = i * 2; idx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aAz', new THREE.Float32BufferAttribute(az, 1));
  g.setIndex(idx);
  const m = new THREE.ShaderMaterial({
    uniforms: U, side: THREE.DoubleSide,
    vertexShader: `attribute float aAz; varying float vAz; varying float vY; void main(){ vAz=aAz; vY=position.y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: COMMON + `varying float vAz; varying float vY;
      void main(){ float h = mountH(vAz); vec3 c = mountainCol(vAz, clamp(vY/h, 0.0, 1.0)) * uSkyGain; gl_FragColor = vec4(c,1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      }`
  });
  var mountains = new THREE.Mesh(g, m);
  mountains.frustumCulled = false; mountains.renderOrder = -9;
  scene.add(mountains);
}

// ============================================================ water mask (DataTexture)
const MW = 192, MH = 256, TEX_PER_M = MW / AREA_W; // 2.6667 texels per m
const maskData = new Uint8Array(MW * MH);
const maskTex = new THREE.DataTexture(maskData, MW, MH, THREE.RedFormat, THREE.UnsignedByteType);
maskTex.magFilter = THREE.LinearFilter; maskTex.minFilter = THREE.LinearFilter;
maskTex.wrapS = maskTex.wrapT = THREE.ClampToEdgeWrapping;
maskTex.needsUpdate = true;
const cellDone = new Array(COLS * ROWS).fill(false);

// ============================================================ reflection target (roller + birds, mirrored)
const reflRT = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, depthBuffer: true });

// ============================================================ water shader
const WU = Object.assign({}, U, {
  uMask: { value: maskTex }, uRefl: { value: reflRT.texture }, uRes: { value: new THREE.Vector2(1, 1) },
  uRol: { value: new THREE.Vector4(0, 0, 0, 0) },
  uSweep: { value: new THREE.Vector4(0, 0, -36, 36) },
  uRing: { value: new THREE.Vector4(0, -48, 0, 0) },
  uCalmR: { value: 0 }, uWaveN: { value: 3 }, uFogAmt: { value: 0.5 },
  uShadowLen: { value: 15 }, uHemi: { value: new THREE.Color(0.6, 0.7, 0.9) }, uSalt: { value: new THREE.Color('#F0EEE7') },
  uSunDiff: { value: 0.2 }, uGlow: { value: 0 }
});
const waterMat = new THREE.ShaderMaterial({
  uniforms: WU,
  extensions: { derivatives: true },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: COMMON + /* glsl */`
varying vec3 vW;
uniform sampler2D uMask; uniform sampler2D uRefl; uniform vec2 uRes;
uniform vec4 uRol; uniform vec4 uSweep; uniform vec4 uRing; uniform float uCalmR; uniform float uWaveN; uniform float uFogAmt;
uniform float uShadowLen; uniform vec3 uHemi; uniform vec3 uSalt; uniform float uSunDiff; uniform float uGlow;
// hexagon-like salt crust cells (voronoi on a jittered staggered lattice)
vec2 voro(vec2 p){
  vec2 n = floor(p); vec2 f = fract(p);
  float md = 8.0; vec2 mr = vec2(0.0); vec2 mg = vec2(0.0);
  for (int j=-1;j<=1;j++) for (int i=-1;i<=1;i++){
    vec2 g = vec2(float(i), float(j));
    vec2 o = 0.5 + 0.32*(hash22(n+g) - 0.5) + vec2(mod(n.y+g.y, 2.0)*0.5 - 0.25, 0.0);
    vec2 r = g + o - f; float d = dot(r,r);
    if (d < md) { md = d; mr = r; mg = g; }
  }
  float ed = 8.0;
  for (int j=-2;j<=2;j++) for (int i=-2;i<=2;i++){
    vec2 g = mg + vec2(float(i), float(j));
    vec2 o = 0.5 + 0.32*(hash22(n+g) - 0.5) + vec2(mod(n.y+g.y, 2.0)*0.5 - 0.25, 0.0);
    vec2 r = g + o - f;
    if (dot(mr-r, mr-r) > 1e-5) ed = min(ed, dot(0.5*(mr+r), normalize(r-mr)));
  }
  return vec2(ed, hash12(n+mg));
}
void main(){
  vec2 p = vW.xz;
  vec3 toCam = cameraPosition - vW;
  float dist = length(toCam);
  vec3 V = toCam / dist;

  // ---- calm amount (mask + outer ring)
  vec2 muv = vec2((p.x + ${(AREA_W / 2).toFixed(1)}) / ${AREA_W.toFixed(1)}, (-p.y) / ${AREA_D.toFixed(1)});
  vec2 jit = (vec2(vnoise(p*0.33), vnoise(p*0.33 + 17.3)) - 0.5) * vec2(0.016, 0.011);
  vec2 mu2 = muv + jit;
  float m = 0.0;
  if (mu2.x > 0.0 && mu2.x < 1.0 && mu2.y > 0.0 && mu2.y < 1.0) m = texture2D(uMask, mu2).r;
  float rr = length(p - uRing.xy);
  float outer = 1.0 - smoothstep(uCalmR - 10.0, uCalmR, rr);
  float calm = smoothstep(0.0, 1.0, clamp(max(m, outer), 0.0, 1.0));

  // ---- surface slope (waves + roller bulge)
  vec2 g = vec2(0.0);
  vec2 d1 = vec2(0.80, 0.60), d2 = vec2(-0.45, 0.89), d3 = vec2(0.97, -0.24), d4 = vec2(-0.83, -0.55);
  float ph = vnoise(p*0.15)*6.0;
  g += 0.030*d1*cos(dot(d1,p)*5.3 - uTime*1.9 + ph);
  g += 0.026*d2*cos(dot(d2,p)*8.7 - uTime*2.5 + 1.3 + ph*0.7);
  if (uWaveN > 2.5) g += 0.018*d3*cos(dot(d3,p)*13.9 - uTime*3.2 + 0.4 + ph*1.3);
  if (uWaveN > 3.5) g += 0.014*d4*cos(dot(d4,p)*22.3 - uTime*4.1 + 2.2 + ph*0.5);
  vec2 np = p*1.7 + vec2(uTime*0.22, -uTime*0.16);
  float n0 = vnoise(np);
  g += 0.030*vec2(vnoise(np+vec2(0.12,0.0)) - n0, vnoise(np+vec2(0.0,0.12)) - n0) / 0.12;
  vec2 np2 = p*4.1 + vec2(-uTime*0.35, uTime*0.27);
  float n1 = vnoise(np2);
  g += 0.016*vec2(vnoise(np2+vec2(0.12,0.0)) - n1, vnoise(np2+vec2(0.0,0.12)) - n1) / 0.12;
  float fwp = length(fwidth(p));
  float amp = mix(1.0, 0.02, calm) / (1.0 + dist*0.012) * (1.0 - 0.6*smoothstep(0.04, 0.25, fwp));
  g *= amp;
  // roller: local frame

    workCam(S.x, S.z);
    // droplets from both ends + a little from the front bulge
    const rate = v * (qName === 'low' ? 10 : qName === 'mid' ? 26 : 55);
    let n = rate * dt; while (n > 0) { if (Math.random() < n) dropSpray(); n -= 1; }
    if (S.rollT >= S.rollDur) {
      writeMaskCell(c, r, true);
      cellDone[r * COLS + c] = true;
      S.count++;
      S.speed01 = 0;
      setState('POLISHED');
      const zA = cellZ0(r), zB = zA - CD;
      const wide = S.stage >= 1;
      startSweep(zA + 1, zB - 1, 1.1, wide ? -36 : S.x - 6, wide ? 36 : S.x + 6, 1 + S.stage * 0.25);
      chime(S.stage);
      for (let k = 0; k < (qName === 'low' ? 6 : 14) + S.stage * 3; k++) spawn(1, S.x + (Math.random() - 0.5) * 12, 0.15, zA - Math.random() * CD, 0, 0.6 + Math.random() * 0.5, 0, 1.4 + Math.random(), 0.22, 1.6, 1.15, 0.5);
    }
  } else if (st === 'POLISHED') {
    if (S.t > 1.2) {
      if (S.count >= ORDER.length) { setState('CLIMAX'); S.ct = 0; S.cur = ORDER.length - 1; }
      else {
        S.cur = S.count;
        if (S.count % 6 === 0) { S.stageFrom = S.stage; S.stageTo = S.stage + 1; setState('STAGE_UP'); }
        else { nextZonePath(); setState('NEXT_ZONE'); }
      }
    } else workCam(S.x, S.z);
  } else if (st === 'STAGE_UP') {
    const idx = S.stageFrom;
    stageCam(idx);
    camTau = 0.6;
    const k = ease((S.t - 0.9) / 2.8);
    S.stageF = lerp(S.stageFrom, S.stageTo, k);
    if (S.t > 0.9 && S.t - dt <= 0.9 && idx === 2) startSweep(4, -100, 2.6, -36, 36, 1.4); // 18th: light wave over the whole mirror
    if (S.t > 1.0 && S.t - dt <= 1.0 && idx !== 2) startSweep(4, -CD * (ORDER[S.cur - 1][1] + 1) - 2, 1.8, -36, 36, 1.0);
    applyStageVisuals(false);
    if (S.t > 4.6) { S.stage = S.stageTo; S.stageF = S.stage; applyStageVisuals(true); camTau = 0.45; nextZonePath(); setState('NEXT_ZONE'); }
  } else if (st === 'NEXT_ZONE') {
    const u = clamp(S.t / S.pathDur, 0, 1);
    if (S.path) {
      const [x, z] = bez(S.path, ease(u));
      const dx = x - S.path.prev[0], dz = z - S.path.prev[1];
      const d = Math.hypot(dx, dz);
      if (d > 1e-4) {
        S.drumA += d / DRUM_R; // reversing
        const yawT = clamp(Math.atan2(dx, dz), -0.7, 0.7);
        S.yaw += (yawT - S.yaw) * (1 - Math.exp(-dt * 6));
        rollSpeed = clamp(d / dt / 12, 0, 0.6);
      }
      S.path.prev = [x, z]; S.x = x; S.z = z;
      if (u > 0.85) S.yaw *= Math.exp(-dt * 8);
    }
    workCam(S.x, S.z);
    if (u >= 1) { S.yaw = 0; placeRollerAtCell(S.cur); setState('WAIT_INPUT'); }
  } else if (st === 'CLIMAX') {
    S.ct += dt; const t = S.ct;
    if (!S.climaxReached) { S.climaxReached = true; startSweep(4, -100, 2.2, -36, 36, 1.6); }
    if (t < 4.8) { climaxWideCam(); camTau = 0.7; }
    // gold ring spreads beyond the work area; outer water calms in step with it
    const ru = clamp((t - 2.0) / 4.0, 0, 1);
    S.ring.r = 46 + 1500 * Math.pow(ru, 2.1);
    S.ring.a = ru > 0 && ru < 1 ? (1 - ru) * 1.3 + 0.2 : 0;
    S.calmR = ru > 0 ? S.ring.r : 0;
    if (t > 2.0 && t - dt <= 2.0) { softSweep(); }
    if (t >= 4.8) { horizonCam(); camTau = lerp(1.4, 0.5, clamp((t - 4.8) / 5, 0, 1)); }
    const g = sstep(5.5, 11, t);
    S.exposure = 1.04 + 0.05 * g; S.bloomExtra = 0.1 * g; S.fogAmt = 0.5 - 0.2 * g;
    S.stageF = 3;
    if (t > 9.0 && t - dt <= 9.0) grandChord();
    if (t > 12.5) { setState('AFTERGLOW'); S.afterglowReached = true; }
  } else if (st === 'AFTERGLOW') {
    horizonCam(); camTau = 0.6;
    if (AU.wind && AU.ctx) AU.wind.gain.setTargetAtTime(0.05, AU.ctx.currentTime, 2);
    if (S.t > 12) {
      S.afterReady = true;
      S.glow = 0.45 + 0.45 * Math.sin(S.time * 2.0);
      if (Math.random() < dt * 2) gatherSpark();
    }
  } else if (st === 'RESET') {
    if (S.t > 0.02 && fadeA <= 0 && !fadeCapture) { /* waiting for the fade */ }
  }

  // sweep line progress
  if (S.sweep.t >= 0) {
    S.sweep.t += dt;
    const u = clamp(S.sweep.t / S.sweep.dur, 0, 1);
    S.sweep.z = lerp(S.sweep.from, S.sweep.to, ease(u));
    S.sweep.a = Math.sin(Math.PI * u) * S.sweep.str;
    if (u >= 1) { S.sweep.t = -1; S.sweep.a = 0; }
  }

  // roller pose
  roller.root.position.set(S.x - Math.sin(S.yaw) * nudgeOff, 0, S.z - nudgeOff * Math.cos(S.yaw));
  roller.root.rotation.set(0, S.yaw, 0);
  roller.drum.rotation.x = S.drumA - nudgeOff / DRUM_R;
  rollerM.root.position.copy(roller.root.position); rollerM.root.rotation.copy(roller.root.rotation);
  rollerM.drum.rotation.x = roller.drum.rotation.x;
  MAT.grip.emissiveIntensity = S.glow * 1.6;
  glowSprite.material.opacity = clamp(S.glow * 0.55, 0, 1);

  // birds from stage 3
  const bv = S.stageF >= 1.9 || S.state === 'CLIMAX' || S.state === 'AFTERGLOW';
  for (let i = 0; i < birds.length; i++) {
    const b = birds[i], m = birdsM[i];
    b.root.visible = m.root.visible = bv;
    if (!bv) continue;
    const a = b.a0 + S.time * b.sp;
    const cx = S.x, cz = S.z - 40;
    const x = cx + Math.sin(a) * b.r, z = cz - Math.abs(Math.cos(a * 0.7)) * b.r * 0.9 - 30, y = b.h + Math.sin(S.time * 0.3 + b.phase) * 2;
    b.root.position.set(x, y, z);
    b.root.rotation.set(0, a + Math.PI / 2, Math.sin(S.time * 0.4 + i) * 0.15);
    const fl = Math.sin(S.time * 4.2 + b.phase) * (0.5 + 0.5 * Math.max(0, Math.sin(S.time * 0.5 + b.phase))) * 0.55;
    b.wl.rotation.z = fl; b.wr.rotation.z = -fl;
    m.root.position.copy(b.root.position); m.root.rotation.copy(b.root.rotation);
    m.wl.rotation.z = fl; m.wr.rotation.z = -fl;
  }

  // shader uniforms
  WU.uRol.value.set(S.x, S.z, S.yaw, S.state === 'ROLLING' ? S.speed01 : 0);
  WU.uSweep.value.set(S.sweep.z, S.sweep.a, S.sweep.xmin, S.sweep.xmax);
  WU.uRing.value.set(0, -48, S.ring.r, S.ring.a);
  WU.uCalmR.value = S.calmR;
  WU.uFogAmt.value = S.fogAmt;
  if (maskDirty) { maskTex.needsUpdate = true; maskDirty = false; }
  audioRoll(rollSpeed);

  // env map refresh while the sky changes
  envTimer -= dt;
  if (envPending && envTimer <= 0) { envPending = false; envTimer = 0.7; updateEnv(); }

  // lights follow the roller
  sunTarget.position.set(S.x, 0, S.z);
  sun.position.copy(sunTarget.position).addScaledVector(U.uSunDir.value, 80);
  fillTarget.position.copy(sunTarget.position);
  fill.position.set(S.x - Math.sin(SUN_AZ) * 60, 40, S.z + Math.cos(SUN_AZ) * 60);

  const bl = palLerp('bloom', S.stageF) + S.bloomExtra;
  if (bloomPass) { bloomPass.strength = Math.min(0.8, bl); bloomPass.threshold = 0.95; bloomPass.radius = 0.28; }
  renderer.toneMappingExposure = clamp(S.exposure, 0.95, 1.12);
  updateParticles(dt);
  updateCamera(dt);
  sky.position.copy(camera.position);
  mountains.position.set(camera.position.x, 0, camera.position.z);
  water.position.set(camera.position.x, 0, camera.position.z);
}
function dropSpray() {
  const side = Math.random() < 0.5 ? -1 : 1;
  const front = Math.random() < 0.3;
  const lx = front ? (Math.random() - 0.5) * 11 : side * (5.7 + Math.random() * 0.4);
  const lz = front ? -1.2 : (Math.random() - 0.5) * 0.8;
  const cy = Math.cos(S.yaw), sy = Math.sin(S.yaw);
  const x = S.x + lx * cy + lz * sy, z = S.z - lx * sy + lz * cy;
  const vx = front ? (Math.random() - 0.5) * 0.6 : side * (0.8 + Math.random() * 1.4);
  const vz = front ? -(1.2 + Math.random() * 1.2) : -(0.5 + Math.random() * 1.5);
  spawn(0, x, 0.05, z, vx * cy + vz * sy, 1.6 + Math.random() * 2.2, -vx * sy + vz * cy, 1.2, 0.06 + Math.random() * 0.07, 0.95, 1.0, 1.05);
}
function gatherSpark() {
  const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 2.5;
  const tx = S.x + (Math.random() - 0.5) * 8, ty = 2.55, tz = S.z + 3.4;
  spawn(2, tx + Math.cos(a) * r, ty + 0.5 + Math.random() * 1.8, tz + Math.sin(a) * r, 0, 0, 0, 1.6, 0.16, 1.7, 1.2, 0.55, tx, ty, tz);
}

// ============================================================ autotest driver (same handlers as real input)
if (AUTO) window.__dbg = { S, maskData, cam, camD };
const A = { seq: null, st: 0, n: 0, resetTapped: false, done: false };
function fake(type, x, y, id = 11) {
  const e = { pointerId: id, clientX: x, clientY: y, pointerType: 'touch', isPrimary: id === 11, button: 0, preventDefault() {} };
  if (type === 'down') onDown(e); else if (type === 'move') onMove(e); else if (type === 'up') onUp(e); else onCancel(e);
}
function autoDrive(dt) {
  if (!AUTO || A.done) return;
  if (A.seq) {
    A.st += dt;
    while (A.seq.length && A.seq[0][0] <= A.st) { const [, f] = A.seq.shift(); f(); }
    if (!A.seq.length) A.seq = null;
    return;
  }
  if ((S.state === 'READY' || S.state === 'WAIT_INPUT') && S.t > 0.7) {
    const p = screenOf(S.x, 1.6, S.z + 1.8);
    const sm = Math.min(innerWidth, innerHeight);
    const kind = A.n % 4; A.n++; A.st = 0;
    if (kind === 1) { // plain tap
      A.seq = [[0, () => fake('down', p.x, p.y)], [0.12, () => fake('up', p.x, p.y)]];
    } else if (kind === 2) { // cancelled touch, then a forward push with a second finger ignored
      A.seq = [[0, () => fake('down', p.x, p.y)], [0.05, () => fake('cancel', p.x, p.y)],
        [0.2, () => fake('down', p.x, p.y)], [0.25, () => fake('down', p.x + 40, p.y, 12)],
        [0.3, () => fake('move', p.x, p.y - sm * 0.03)], [0.4, () => fake('move', p.x, p.y - sm * 0.07)], [0.5, () => fake('up', p.x, p.y - sm * 0.07)]];
    } else { // forward push
      A.seq = [[0, () => fake('down', p.x, p.y)], [0.08, () => fake('move', p.x, p.y - sm * 0.025)], [0.16, () => fake('move', p.x, p.y - sm * 0.065)], [0.3, () => fake('up', p.x, p.y - sm * 0.065)]];
    }
  } else if (S.state === 'AFTERGLOW' && S.afterReady && !A.resetTapped) {
    A.resetTapped = true; const p = screenOf(S.x, 1.4, S.z + 1.2); A.st = 0;
    A.seq = [[0.5, () => fake('down', p.x, p.y)], [0.65, () => fake('up', p.x, p.y)]];
  } else if (S.state === 'READY' && A.resetTapped && S.resetCount > 0) {
    A.done = true; alog('autotest done');
  }
}

// ============================================================ main loop
let last = performance.now(), frames = 0, fpsEma = 30;
function publishTest() {
  window.__test = {
    state: S.state, count: S.count, stage: S.stage + 1, stageF: +S.stageF.toFixed(2), climaxReached: S.climaxReached, climaxT: +S.ct.toFixed(2),
    cam: [Math.round(cam.dist), +(cam.pitch / D2R).toFixed(1), +(cam.yaw / D2R).toFixed(1)], afterglowReached: S.afterglowReached, resetCount: S.resetCount, done: A.done, q: qName, fps: +fpsEma.toFixed(1),
    roller: (() => { const p = screenOf(S.x, 1.2, S.z + 1); return [Math.round(p.x), Math.round(p.y)]; })(),
    sun: (() => { const p = screenOf(camera.position.x + U.uSunDir.value.x * 1000, camera.position.y + U.uSunDir.value.y * 1000, camera.position.z + U.uSunDir.value.z * 1000); return [Math.round(p.x), Math.round(p.y)]; })()
  };
}
function render() {
  if (ctxLost) return;
  // mirrored roller and birds into the reflection target
  camera.layers.set(1);
  renderer.setRenderTarget(reflRT);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x000000, 1);
  camera.layers.set(0);
  if (useComposer) composer.render(); else renderer.render(scene, camera);
}
function frame(now) {
  requestAnimationFrame(frame);
  try {
    const raw = Math.min(1, Math.max(0, (now - last) / 1000)); last = now;
    if (raw > 0) fpsEma += (1 / raw - fpsEma) * 0.1;
    const dt = Math.min(raw, AUTO ? 0.35 : 0.1) * TSCALE;
    const steps = dt > 0.2 ? Math.ceil(dt / 0.2) : 1;
    for (let i = 0; i < steps; i++) { autoDrive(dt / steps); update(dt / steps); }
    render();
    if (fadeCapture) {
      fadeCapture = false;
      try { fadeCtx.clearRect(0, 0, fadeCv.width, fadeCv.height); fadeCtx.drawImage(canvas, 0, 0, fadeCv.width, fadeCv.height); } catch (e) { logErr(e); }
      fadeA = 1; fadeCv.style.opacity = '1';
      S.resetCount++; resetWorld();
    } else if (fadeA > 0) {
      fadeA = Math.max(0, fadeA - raw / 2.0);
      fadeCv.style.opacity = String(ease(fadeA));
    }
    frames++;
    if (frames === 3) {
      window.__ready = true;
      document.getElementById('ld').classList.add('off');
      alog('ready', 'q=' + qName);
    }
    autoQuality(raw);
    publishTest();
  } catch (e) { logErr(e); }
}

// ============================================================ boot
try {
  placeRollerAtCell(0);
  applyQuality(qName);
  applyStageVisuals(true);
  workCam(S.x, S.z); camSnap = true; updateCamera(0);
  renderer.compile(scene, camera);
  setState('READY');
  requestAnimationFrame(frame);
} catch (e) { logErr(e); }
</script>
<script src="../../gf-playlog.js" defer></script>
